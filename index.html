        <p>O texto bíblico declara <em>idades</em>, não anos AM. Por isso os anos aparecem como <b>calculados</b>. Uma data é <b>inferida</b> quando depende de uma interpretação, como o nascimento de Abraão, e pessoas sem fundamento textual ficam <b>sem data</b>. A posição delas na árvore é só ilustrativa e nunca é gravada como dado.</p>
        <h3 style="font:600 15px Georgia,serif;margin:14px 0 6px">Legenda</h3>${Panel.legendHTML()}
        ${rows ? `<h3 style="font:600 15px Georgia,serif;margin:16px 0 6px">Como os anos foram obtidos</h3><table class="calc"><thead><tr><th>Pessoa</th><th>AM</th><th>Fundamento</th></tr></thead><tbody>${rows}</tbody></table>` : ''}
        <h3 style="font:600 15px Georgia,serif;margin:16px 0 6px">Seus dados</h3>
        <p class="small">Tudo fica no armazenamento local deste navegador e deste arquivo. Limpar os dados do navegador apaga o conteúdo, portanto exporte backups em JSON com regularidade.</p>
      </div>
      <div class="d-foot"><button class="btn primary" data-act="dlg-close">Fechar</button></div>`);
  }
};

/* =====================================================================
 * APLICAÇÃO: estado da interface, ações e eventos do navegador
 * ===================================================================== */
const App = {
  selectedId: null, selectedEventId: null, highlight: null, hoverYear: null, keepPanelScroll: false,

  /* Único ponto de atualização após alterar dados. */
  changed({ keepScroll = false } = {}) {
    $$('.toast.undo').forEach(t => t.remove()); // um "desfazer" antigo apagaria alterações posteriores
    Index.rebuild(Store.doc);
    Layout.compute();
    if (this.selectedId && !People.get(this.selectedId)) this.selectedId = null;
    if (this.selectedEventId && !Events.get(this.selectedEventId)) this.selectedEventId = null;
    if (this.highlight) this.refreshHighlight();
    Render.resetCards();
    this.keepPanelScroll = keepScroll;
    Panel.render();
    this.paintChrome();
    Store.save();
    View.constrain();
    View.request();
  },
  paintChrome() {
    const s = Store.doc.settings;
    $('#rulerHead').innerHTML = s.calendar === 'AM' ? '<b>AM</b><span class="hide-sm">Anno Mundi · Criação = 0</span>' : `<b>a.C./d.C.</b><span class="hide-sm">${esc(s.methodologyName)}: AM 0 = ${s.creationYearBC} a.C.</span>`;
    $('#emptyStage').hidden = Store.doc.persons.length > 0;
    const h = this.highlight;
    $('#hlBanner').hidden = !h;
    if (h) $('#hlText').textContent = `${h.label} · ${plural(h.set.size, 'pessoa', 'pessoas')}`;
  },
  select(id, { focus = false } = {}) {
    this.selectedId = id; this.selectedEventId = null;
    Panel.render(); Render.syncCardStates(); View.persist();
    if (focus) View.focusPerson(id);
    if (innerWidth <= 860) $('#panel').classList.add('open');
    View.request();
  },
  openEvent(id, { focus = false } = {}) {
    this.selectedEventId = id;
    Panel.render();
    if (innerWidth <= 860) $('#panel').classList.add('open');
    const y = Events.years(Events.get(id));
    if (focus && y.start !== null) View.focusYear(y.start);
    View.request();
  },
  /* ---------- destaques ---------- */
  setHighlight(rootId, mode) {
    const cur = this.highlight;
    if (cur && cur.rootId === rootId && cur.mode === mode) return this.clearHighlight();
    this.highlight = { rootId, mode };
    this.refreshHighlight();
    Panel.render(); Render.syncCardStates(); this.paintChrome(); View.request();
  },
  refreshHighlight() {
    const h = this.highlight;
    if (h.mode === 'path') {
      const a = People.get(h.rootId), b = People.get(h.toId);
      const set = a && b ? this.lineageSet(h.rootId, h.toId) : null;
      if (!set) { this.highlight = null; return; }
      h.set = set; h.label = `Linhagem de ${a.name} até ${b.name}`;
      return;
    }
    const p = People.get(h.rootId);
    if (!p) { this.highlight = null; return; }
    const set = new Set([h.rootId]);
    if (h.mode !== 'desc') Relations.ancestorSet(h.rootId).forEach(x => set.add(x));
    if (h.mode !== 'anc') Relations.descendantSet(h.rootId).forEach(x => set.add(x));
    h.set = set;
    h.label = { anc: `Ancestrais de ${p.name}`, desc: `Descendentes de ${p.name}`, both: `Ancestrais e descendentes de ${p.name}` }[h.mode];
  },
  lineageSet(a, b) {
    if (a === b) return new Set([a]);
    const down = Relations.descendantSet(a), up = Relations.ancestorSet(b);
    if (!up.has(a)) return null;
    const set = new Set([a, b]);
    for (const x of down) if (up.has(x)) set.add(x);
    return set;
  },
  highlightLineage(a, b) {
    if (!this.lineageSet(a, b)) return false;
    this.highlight = { rootId: a, toId: b, mode: 'path' };
    this.refreshHighlight();
    Panel.render(); Render.syncCardStates(); this.paintChrome(); View.request();
    const na = Layout.nodes.get(a), nb = Layout.nodes.get(b);
    if (na && nb) {
      const x1 = Math.min(na.x, nb.x), x2 = Math.max(na.x, nb.x) + CARD_W, y1 = Math.min(na.y, nb.y), y2 = Math.max(na.y, nb.y) + CARD_H;
      const s = clamp(Math.min((View.w - 90) / (x2 - x1), (View.h - 90) / (y2 - y1)), MIN_ZOOM, MAX_ZOOM);
      View.center((x1 + x2) / 2, (y1 + y2) / 2, s);
    }
    return true;
  },
  clearHighlight() { this.highlight = null; Panel.render(); Render.syncCardStates(); this.paintChrome(); View.request(); },

  /* ---------- ações de cadastro ---------- */
  applyFlowExisting(flow, existingId) {
    const snapshot = Store.snapshot();
    try {
      const t = flow.targetId;
      if (flow.type === 'child') Relations.addParent(existingId, t);
      if (flow.type === 'parent') Relations.addParent(t, existingId);
      if (flow.type === 'spouse') Relations.addUnion(t, existingId);
      if (flow.type === 'sibling') {
        const links = Relations.parentLinks(t);
        if (!links.length) throw new Error('Registre ao menos um dos pais desta pessoa antes de vincular um irmão ou irmã existente: a relação é derivada dos pais em comum.');
        for (const l of links) if (!Relations.parentLinks(existingId).some(x => x.parentId === l.parentId)) Relations.addParent(existingId, l.parentId, { role: l.role, kind: l.kind });
      }
    } catch (e) { Store.doc = JSON.parse(snapshot); Index.rebuild(Store.doc); throw e; }
    this.selectedId = existingId;
    this.changed();
    toast('Vínculo criado.');
  },
  async deletePerson(id) {
    const p = People.get(id);
    if (!p) return;
    const n = People.relationshipCount(id);
    if (n > 0) {
      const parts = [['pais', Relations.parentLinks(id).length], ['filhos', Relations.childLinks(id).length], ['uniões', Relations.unions(id).length], ['eventos', (Index.eventsOf.get(id) || []).length]].filter(x => x[1]);
      const ok = await Dialogs.confirm({
        title: `Excluir ${p.name}?`, ok: 'Excluir', danger: true,
        body: `<p style="margin-top:0">Esta pessoa possui vínculos: <b>${parts.map(x => `${x[1]} ${x[0]}`).join(', ')}</b>.</p><p>Os vínculos serão removidos; as outras pessoas continuam cadastradas. Os graus de parentesco que dependem desta pessoa deixam de existir.</p>`
      });
      if (!ok) return;
    }
    withUndo(`${p.name} excluído(a).`, () => { People.remove(id); if (this.selectedId === id) this.selectedId = null; this.changed(); });
  },
  async deleteEvent(id) {
    const e = Events.get(id);
    if (!e) return;
    const ok = await Dialogs.confirm({ title: `Excluir o evento "${e.name}"?`, ok: 'Excluir', danger: true, body: '<p style="margin-top:0">O evento será removido da régua e das páginas dos personagens. As pessoas não são afetadas.</p>' });
    if (!ok) return;
    Dialogs.close();
    withUndo('Evento excluído.', () => { Events.remove(id); this.changed(); });
  },

  /* ---------- importação e exportação ---------- */
  exportJSON() {
    const blob = new Blob([Store.exportText()], { type: 'application/json' });
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = `genbio-backup-${new Date().toISOString().slice(0, 10)}.json`;
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(() => URL.revokeObjectURL(a.href), 2000);
    toast('Backup exportado.');
  },
  async importText(text) {
    let parsed;
    try {
      parsed = sanitizeDoc(JSON.parse(text));
    } catch (e) { toast('Importação cancelada: ' + (e instanceof SyntaxError ? 'o arquivo não é um JSON válido.' : e.message), { error: true, ms: 7000 }); return false; }
    const { doc, issues } = parsed;
    const ok = await Dialogs.confirm({
      title: 'Importar dados?', ok: 'Substituir e importar', danger: true,
      body: `<p style="margin-top:0">O arquivo contém <b>${plural(doc.persons.length, 'pessoa', 'pessoas')}</b>, ${plural(doc.parentLinks.length, 'vínculo parental', 'vínculos parentais')}, ${plural(doc.unions.length, 'união', 'uniões')} e ${plural(doc.events.length, 'evento', 'eventos')}.</p><p>Os dados atuais serão substituídos.</p>${issues.length ? `<div class="warnbox"><b>${plural(issues.length, 'problema corrigido', 'problemas corrigidos')}:</b><br>${issues.slice(0, 8).map(esc).join('<br>')}${issues.length > 8 ? `<br>… e mais ${issues.length - 8}` : ''}</div>` : ''}`
    });
    if (!ok) return false;
    withUndo('Dados importados.', () => { Store.doc = doc; this.selectedId = null; this.selectedEventId = null; this.highlight = null; this.changed(); });
    View.fit();
    return true;
  },
  async clearData() {
    const ok = await Dialogs.confirm({ title: 'Limpar todos os dados?', ok: 'Limpar tudo', danger: true, body: `<p style="margin-top:0">Serão removidos <b>${plural(Store.doc.persons.length, 'pessoa', 'pessoas')}</b> e <b>${plural(Store.doc.events.length, 'evento', 'eventos')}</b> deste navegador. Considere exportar um backup antes.</p>` });
    if (!ok) return;
    withUndo('Dados removidos.', () => { Store.doc = emptyDoc(); this.selectedId = null; this.selectedEventId = null; this.highlight = null; this.changed(); });
  },
  async restoreSeed() {
    const ok = await Dialogs.confirm({ title: 'Restaurar dados bíblicos iniciais?', ok: 'Restaurar', danger: true, body: '<p style="margin-top:0">Os dados atuais serão substituídos pelos registros bíblicos iniciais.</p>' });
    if (!ok) return;
    withUndo('Dados bíblicos iniciais restaurados.', () => this.loadSeed());
  },
  loadSeed() { Store.doc = Seed.build(); this.selectedId = null; this.selectedEventId = null; this.highlight = null; this.changed(); View.s = .85; View.tx = 36; View.ty = 72; View.request(); },

  /* ---------- despacho de ações por data-act ---------- */
  act(name, id) {
    const flow = type => PersonForm.open({ flow: { type, targetId: id } });
    const map = {
      'new-person': () => PersonForm.open(),
      'select': () => this.select(id, { focus: true }),
      'edit': () => PersonForm.open({ id }),
      'delete': () => this.deletePerson(id),
      'focus': () => View.focusPerson(id),
      'add-child': () => flow('child'), 'add-spouse': () => flow('spouse'), 'add-parent': () => flow('parent'), 'add-sibling': () => flow('sibling'),
      'hl-anc': () => this.setHighlight(id, 'anc'), 'hl-desc': () => this.setHighlight(id, 'desc'), 'hl-both': () => this.setHighlight(id, 'both'), 'hl-clear': () => this.clearHighlight(),
      'open-events': () => EventUI.openList(), 'event-new': () => EventUI.openForm(), 'event-edit': () => EventUI.openForm(id),
      'event-view': () => { Dialogs.close(); this.openEvent(id, { focus: true }); },
      'event-delete': () => this.deleteEvent(id),
      'event-focus': () => View.focusYear(Events.years(Events.get(id)).start),
      'back-person': () => { this.selectedEventId = null; Panel.render(); View.request(); },
      'open-lineage': () => OtherDialogs.lineage(), 'open-calendar': () => OtherDialogs.calendar(), 'open-about': () => OtherDialogs.about(),
      'export-json': () => this.exportJSON(), 'import-json': () => $('#importFile').click(),
      'clear-data': () => this.clearData(), 'restore-seed': () => this.restoreSeed(), 'load-seed': () => { this.loadSeed(); },
      'dlg-close': () => Dialogs.close(),
      'panel-close': () => $('#panel').classList.remove('open'),
      'zoom-in': () => View.zoomAt(1.25, View.w / 2, View.h / 2), 'zoom-out': () => View.zoomAt(.8, View.w / 2, View.h / 2), 'zoom-fit': () => View.fit()
    };
    if (map[name]) map[name]();
  },

  bind() {
    document.addEventListener('click', e => {
      const b = e.target.closest('[data-act]');
      if (!b) { const m = $('#dataMenu'); if (m.open && !e.target.closest('#dataMenu')) m.open = false; return; }
      if (b.closest('#dataMenu')) $('#dataMenu').open = false;
      e.preventDefault();
      this.act(b.dataset.act, b.dataset.id);
    });
    $('#dlg').addEventListener('cancel', () => { /* Esc fecha via comportamento nativo */ });
    $('#dlg').addEventListener('close', () => { $('#dlg').innerHTML = ''; });
    $('#importFile').addEventListener('change', async e => {
      const f = e.target.files[0];
      e.target.value = '';
      if (f) this.importText(await f.text());
    });
    this.bindStage(); this.bindRuler(); this.bindMinimap(); this.bindSearch(); this.bindKeys();
    window.addEventListener('beforeunload', () => Store.saveNow());
    new ResizeObserver(() => { View.constrain(); View.request(); }).observe($('#stage'));
  },

  bindStage() {
    const stage = $('#stage'), pointers = new Map();
    let moved = false, startDist = 0, startS = 0, downTarget = null, startX = 0, startY = 0;
    const local = e => { const r = stage.getBoundingClientRect(); return [e.clientX - r.left, e.clientY - r.top]; };
    const uiTarget = t => t.closest('#zoomCtl,#minimap,#hlBanner,#emptyStage,.cactions');
    stage.addEventListener('pointerdown', e => {
      if (uiTarget(e.target) || e.button === 2) return;
      pointers.set(e.pointerId, [e.clientX, e.clientY]);
      downTarget = e.target; moved = false; startX = e.clientX; startY = e.clientY;
      if (pointers.size === 2) {
        const [a, b] = Array.from(pointers.values());
        startDist = Math.hypot(a[0] - b[0], a[1] - b[1]); startS = View.s; moved = true;
      }
    });
    stage.addEventListener('pointermove', e => {
      const [lx, ly] = local(e);
      if (!pointers.has(e.pointerId)) {
        const y = View.yearAt(ly);
        this.hoverYear = (ly >= 0 && ly <= View.h && y >= Layout.bounds.minY / YEAR_PX - 50 && y <= Layout.bounds.maxY / YEAR_PX) ? y : null;
        this.hoverTip(e, lx, ly);
        View.request();
        return;
      }
      const prev = pointers.get(e.pointerId);
      const dx = e.clientX - prev[0], dy = e.clientY - prev[1];
      pointers.set(e.pointerId, [e.clientX, e.clientY]);
      if (pointers.size === 2) {
        const [a, b] = Array.from(pointers.values());
        const dist = Math.hypot(a[0] - b[0], a[1] - b[1]);
        const r = stage.getBoundingClientRect();
        const cx = (a[0] + b[0]) / 2 - r.left, cy = (a[1] + b[1]) / 2 - r.top;
        View.zoomAt(startS * (dist / (startDist || 1)) / View.s, cx, cy);
        return;
      }
      if (!moved && Math.hypot(e.clientX - startX, e.clientY - startY) < 5) return;
      if (!moved) { moved = true; stage.setPointerCapture(e.pointerId); stage.classList.add('panning'); $('#tip').hidden = true; }
      View.panBy(dx, dy);
    });
    const up = e => {
      if (!pointers.has(e.pointerId)) return;
      pointers.delete(e.pointerId);
      stage.classList.remove('panning');
      if (moved) return;
      const [lx, ly] = local(e);
      const card = downTarget && downTarget.closest && downTarget.closest('.card');
      const id = card ? card.dataset.id : (Layout.hit(View.worldX(lx), View.worldY(ly)) || {}).id;
      if (id) this.select(id);
    };
    stage.addEventListener('pointerup', up);
    stage.addEventListener('pointercancel', e => { pointers.delete(e.pointerId); stage.classList.remove('panning'); });
    stage.addEventListener('pointerleave', () => { this.hoverYear = null; $('#tip').hidden = true; View.request(); });
    stage.addEventListener('dblclick', e => {
      if (uiTarget(e.target)) return;
      const card = e.target.closest('.card');
      if (card) PersonForm.open({ id: card.dataset.id });
    });
    stage.addEventListener('keydown', e => {
      const card = e.target.closest && e.target.closest('.card');
      if (card && (e.key === 'Enter' || e.key === ' ') && e.target === card) { e.preventDefault(); this.select(card.dataset.id); }
    });
    stage.addEventListener('wheel', e => {
      e.preventDefault();
      const [lx, ly] = local(e);
      const unit = e.deltaMode === 1 ? 18 : 1;
      if (e.ctrlKey || e.metaKey) View.zoomAt(Math.exp(-e.deltaY * unit * 0.0022), lx, ly);
      else if (e.shiftKey) View.panBy(-(e.deltaY || e.deltaX) * unit, 0);
      else View.panBy(-e.deltaX * unit, -e.deltaY * unit);
    }, { passive: false });
  },
  hoverTip(e, lx, ly) {
    const tip = $('#tip');
    const onCard = e.target.closest && e.target.closest('.card');
    const n = !onCard && e.target.id === 'treeCanvas' ? Layout.hit(View.worldX(lx), View.worldY(ly)) : null;
    if (!n) { tip.hidden = true; return; }
    const age = Chrono.age(n.p);
    this.showTip(`<b>${esc(People.label(n.p))}</b><br>${esc(Chrono.lifeText(n.p))}${age.value !== null ? ` · ${plural(age.value, 'ano', 'anos')}` : ''}`, e);
  },
  showTip(html, e) {
    const tip = $('#tip');
    tip.innerHTML = html; tip.hidden = false;
    const r = tip.getBoundingClientRect();
    tip.style.left = Math.min(e.clientX + 14, innerWidth - r.width - 8) + 'px';
    tip.style.top = Math.min(e.clientY + 14, innerHeight - r.height - 8) + 'px';
  },
  bindRuler() {
    const ruler = $('#ruler'), canvas = $('#rulerCanvas');
    let drag = null;
    const pos = e => { const r = canvas.getBoundingClientRect(); return [e.clientX - r.left, e.clientY - r.top]; };
    const hitAt = (x, y) => Render.rulerHits.find(h => x >= h.x1 && x <= h.x2 && y >= h.y1 && y <= h.y2);
    canvas.addEventListener('pointerdown', e => { drag = { y: e.clientY, last: e.clientY, moved: false, id: e.pointerId }; });
    canvas.addEventListener('pointermove', e => {
      const [x, y] = pos(e);
      if (drag && e.pointerId === drag.id) {
        if (!drag.moved && Math.abs(e.clientY - drag.y) > 4) { drag.moved = true; canvas.setPointerCapture(e.pointerId); }
        if (drag.moved) { View.panBy(0, e.clientY - drag.last); drag.last = e.clientY; }
        return;
      }
      const h = hitAt(x, y);
      canvas.style.cursor = h ? 'pointer' : 'ns-resize';
      if (h) this.showTip(`<b>${esc(h.e.name)}</b><br>${esc(Events.rangeText(h.e))}`, e); else $('#tip').hidden = true;
      this.hoverYear = View.yearAt(y); View.request();
    });
    canvas.addEventListener('pointerup', e => {
      const d = drag; drag = null;
      if (!d || d.moved) return;
      const [x, y] = pos(e), h = hitAt(x, y);
      if (h) this.openEvent(h.e.id);
      else View.focusYear(View.yearAt(y));
    });
    canvas.addEventListener('pointercancel', () => { drag = null; });
    canvas.addEventListener('pointerleave', () => { $('#tip').hidden = true; this.hoverYear = null; View.request(); });
    ruler.addEventListener('wheel', e => {
      e.preventDefault();
      const r = $('#stage').getBoundingClientRect(), ly = e.clientY - r.top;
      if (e.ctrlKey) View.zoomAt(Math.exp(-e.deltaY * 0.0022), View.w / 2, ly);
      else View.panBy(0, -e.deltaY * (e.deltaMode === 1 ? 18 : 1));
    }, { passive: false });
  },
  bindMinimap() {
    const c = $('#minimap');
    const go = e => {
      const r = c.getBoundingClientRect(), g = Render.miniGeom(r.width, r.height);
      const wx = (e.clientX - r.left - g.ox) / g.k, wy = (e.clientY - r.top - g.oy) / g.k;
      View.cancelAnim();
      View.tx = View.w / 2 - wx * View.s; View.ty = View.h / 2 - wy * View.s;
      View.constrain(); View.persist(); View.request();
    };
    c.addEventListener('pointerdown', e => { e.stopPropagation(); c.setPointerCapture(e.pointerId); c.dataset.drag = '1'; go(e); });
    c.addEventListener('pointermove', e => { if (c.dataset.drag) go(e); });
    c.addEventListener('pointerup', () => { delete c.dataset.drag; });
  },
  bindSearch() {
    const input = $('#searchInput'), list = $('#searchList');
    let rows = [], active = -1;
    const close = () => { list.hidden = true; active = -1; };
    const paint = () => {
      const q = input.value;
      if (!norm(q)) { close(); return; }
      const ppl = People.search(q, 10).map(p => ({ t: 'p', id: p.id, html: `${esc(People.label(p))}<em>${esc(Chrono.lifeText(p))}${p.altNames.length ? ' · ' + esc(p.altNames.join(', ')) : ''}</em>` }));
      const evs = Events.search(q, 5).map(e => ({ t: 'e', id: e.id, html: `◆ ${esc(e.name)}<em>Evento · ${esc(Events.rangeText(e))}</em>` }));
      rows = ppl.concat(evs);
      list.innerHTML = rows.length ? rows.map((r, i) => `<div data-i="${i}">${r.html}</div>`).join('') : '<em style="padding:8px;display:block">Nenhum resultado</em>';
      list.hidden = false; active = -1;
    };
    const choose = r => {
      if (!r) return;
      input.value = ''; close(); input.blur();
      if (r.t === 'p') this.select(r.id, { focus: true }); else this.openEvent(r.id, { focus: true });
    };
    input.addEventListener('input', paint);
    input.addEventListener('focus', paint);
    input.addEventListener('blur', () => setTimeout(close, 130));
    input.addEventListener('keydown', e => {
      const els = $$('[data-i]', list);
      if (e.key === 'ArrowDown' || e.key === 'ArrowUp') {
        e.preventDefault();
        active = clamp(active + (e.key === 'ArrowDown' ? 1 : -1), 0, els.length - 1);
        els.forEach((x, i) => x.classList.toggle('act', i === active));
      } else if (e.key === 'Enter') { e.preventDefault(); choose(rows[active >= 0 ? active : 0]); }
      else if (e.key === 'Escape') { input.value = ''; close(); input.blur(); }
    });
    list.addEventListener('mousedown', e => {
      e.preventDefault();
      const r = e.target.closest('[data-i]');
      if (r) choose(rows[+r.dataset.i]);
    });
  },
  bindKeys() {
    document.addEventListener('keydown', e => {
      if ($('#dlg').open || $('#dlgConfirm').open) return;
      const tag = (e.target.tagName || '').toLowerCase();
      if (tag === 'input' || tag === 'textarea' || tag === 'select') return;
      const step = e.shiftKey ? 240 : 80;
      const k = e.key;
      if (k === '/') { e.preventDefault(); $('#searchInput').focus(); }
      else if (k === 'ArrowLeft') View.panBy(step, 0);
      else if (k === 'ArrowRight') View.panBy(-step, 0);
      else if (k === 'ArrowUp') { e.preventDefault(); View.panBy(0, step); }
      else if (k === 'ArrowDown') { e.preventDefault(); View.panBy(0, -step); }
      else if (k === '+' || k === '=') View.zoomAt(1.2, View.w / 2, View.h / 2);
      else if (k === '-') View.zoomAt(1 / 1.2, View.w / 2, View.h / 2);
      else if (k === '0') View.fit();
      else if (k === 'Escape') { if (this.highlight) this.clearHighlight(); $('#panel').classList.remove('open'); }
    });
  },
  start() {
    Store.load();
    View.restore();
    this.bind();
    Layout.compute();
    Panel.render();
    this.paintChrome();
    const st = $('#stage').getBoundingClientRect();
    View.w = st.width; View.h = st.height;
    View.constrain();
    View.request();
    Store.saveNow();
  }
};

// Superfície pública: facilita diagnóstico, automação e testes (tests/self-test.js).
window.GenBIO = { Store, Index, People, Relations, Kinship, Events, Chrono, Seed, Layout, View, Render, App, Dialogs, PersonForm, EventUI, sanitizeDoc, emptyDoc };

App.start();
})();
