/* =====================================================================
 * LAYOUT: Y é o tempo; X vem de um percurso em profundidade por raias
 * ===================================================================== */
const YEAR_PX = 2.2, CARD_W = 184, CARD_H = 66, LANE_W = 214, GAP = 10, UNDATED_GEN = 35, BAR_DX = 6;
const Layout = {
  nodes: new Map(), edges: [], unionEdges: [], list: [],
  bounds: { minX: 0, minY: 0, maxX: 1000, maxY: 1000 }, undatedBandY: null, minYear: 0, maxYear: 100,

  /* Posição apenas visual para quem não tem data: nunca é gravada como dado. */
  visualYears() {
    const vy = new Map(), persons = People.all();
    for (const p of persons) if (p.birth.year !== null) vy.set(p.id, p.birth.year);
    const estimate = p => {
      const parents = Relations.parents(p.id).filter(x => vy.has(x)).map(x => vy.get(x));
      const fromParents = parents.length ? Math.max(...parents) + UNDATED_GEN : null;
      const lo = p.birthAfter, hi = p.birthBefore;
      if (lo !== null || hi !== null) {
        let base = fromParents !== null ? fromParents : (lo !== null ? lo : hi);
        if (lo !== null && base < lo) base = lo;
        if (hi !== null && base > hi) base = hi;
        return base;
      }
      for (const s of Relations.siblings(p.id).keys()) { const o = People.get(s); if (o && o.birth.year !== null) return o.birth.year; }
      for (const s of Relations.spouses(p.id)) if (vy.has(s)) return vy.get(s);
      if (fromParents !== null) return fromParents;
      const kids = Relations.children(p.id).filter(x => vy.has(x)).map(x => vy.get(x));
      if (kids.length) return Math.min(...kids) - UNDATED_GEN;
      if (p.death.year !== null) return p.death.year - UNDATED_GEN;
      return null;
    };
    let changed = true;
    for (let guard = 0; changed && guard <= persons.length; guard++) {
      changed = false;
      for (const p of persons) {
        if (vy.has(p.id)) continue;
        const c = estimate(p);
        if (c !== null) { vy.set(p.id, c); changed = true; }
      }
    }
    return vy;
  },

  compute() {
    const persons = People.all(), vy = this.visualYears();
    const nodes = new Map();
    let maxBottom = 0, minTop = 0;
    for (const p of persons) {
      if (!vy.has(p.id)) continue;
      const y = vy.get(p.id) * YEAR_PX;
      const deathY = p.death.year !== null ? p.death.year * YEAR_PX : null;
      const bottom = Math.max(y + CARD_H, deathY !== null ? deathY : 0, p.birth.year !== null && deathY === null ? y + CARD_H + 26 : 0);
      nodes.set(p.id, { id: p.id, p, x: 0, y, w: CARD_W, h: CARD_H, lane: 0, deathY, bottom, undated: p.birth.year === null, order: p.seq, vy: vy.get(p.id) });
      if (bottom > maxBottom) maxBottom = bottom;
      if (y < minTop) minTop = y;
    }
    // Raias: cada uma guarda os intervalos verticais já ocupados.
    const lanes = [];
    const free = (lane, top, bottom) => !lanes[lane] || lanes[lane].every(iv => bottom + GAP <= iv[0] || top >= iv[1] + GAP);
    const reserve = (lane, top, bottom) => { (lanes[lane] = lanes[lane] || []).push([top, bottom]); };
    const seen = new Set();
    const byTime = (a, b) => (nodes.get(a).vy - nodes.get(b).vy) || (nodes.get(a).order - nodes.get(b).order);
    const place = (id, minLane) => {
      if (seen.has(id) || !nodes.has(id)) return;
      seen.add(id);
      const n = nodes.get(id);
      let lane = Math.max(0, minLane);
      while (!free(lane, n.y, n.bottom)) lane++;
      reserve(lane, n.y, n.bottom);
      n.lane = lane;
      for (const s of Relations.spouses(id).filter(x => nodes.has(x)).sort(byTime)) place(s, lane + 1);
      for (const c of Relations.children(id).filter(x => nodes.has(x)).sort(byTime)) place(c, lane);
    };
    const ids = Array.from(nodes.keys()).sort(byTime);
    const maxLane = () => lanes.length;
    for (const id of ids) if (!Relations.parents(id).some(x => nodes.has(x))) {
      if (seen.has(id)) continue;
      // Uma nova família começa à direita das anteriores, exceto se já há parentes posicionados.
      const kin = Relations.spouses(id).concat(Relations.children(id)).filter(x => seen.has(x)).map(x => nodes.get(x).lane);
      place(id, kin.length ? Math.min(...kin) : (seen.size ? maxLane() + 1 : 0));
    }
    for (const id of ids) place(id, 0); // salvaguarda

    // Pessoas sem nenhuma referência cronológica: faixa própria, abaixo da escala.
    const undatedLoose = persons.filter(p => !vy.has(p.id));
    this.undatedBandY = null;
    if (undatedLoose.length) {
      const bandY = maxBottom + 110;
      this.undatedBandY = bandY;
      undatedLoose.forEach((p, i) => {
        const col = i % 10, row = Math.floor(i / 10);
        const y = bandY + 30 + row * (CARD_H + 26);
        nodes.set(p.id, { id: p.id, p, x: col * LANE_W, y, w: CARD_W, h: CARD_H, lane: col, deathY: null, bottom: y + CARD_H, undated: true, order: p.seq, vy: null, loose: true });
      });
    }
    let maxLaneUsed = 0, maxY = maxBottom;
    for (const n of nodes.values()) {
      if (!n.loose) n.x = n.lane * LANE_W;
      if (n.lane > maxLaneUsed) maxLaneUsed = n.lane;
      if (n.bottom > maxY) maxY = n.bottom;
    }
    const edges = [];
    for (const l of Store.doc.parentLinks) {
      const a = nodes.get(l.parentId), b = nodes.get(l.childId);
      if (a && b) edges.push({ a, b, link: l, path: this.edgePath(a, b) });
    }
    const unionEdges = [];
    for (const u of Store.doc.unions) {
      const a = nodes.get(u.partnerIds[0]), b = nodes.get(u.partnerIds[1]);
      if (a && b) unionEdges.push({ a: a.x <= b.x ? a : b, b: a.x <= b.x ? b : a, union: u });
    }
    this.nodes = nodes; this.edges = edges; this.unionEdges = unionEdges; this.list = Array.from(nodes.values());
    let eventMax = 0, eventMin = 0;
    for (const e of Events.all()) { const y = Events.years(e); if (y.start !== null) { eventMin = Math.min(eventMin, y.start); eventMax = Math.max(eventMax, y.end ?? y.start); } }
    this.bounds = {
      minX: 0, maxX: (maxLaneUsed + 1) * LANE_W - (LANE_W - CARD_W),
      minY: Math.min(minTop, eventMin * YEAR_PX), maxY: Math.max(maxY, eventMax * YEAR_PX, 60)
    };
  },

  /* Linha nasce na barra de vida do genitor, na altura do nascimento do filho. */
  edgePath(a, b) {
    const cy = b.y + b.h / 2;
    const hasBar = a.deathY !== null && !a.undated;
    const sx = hasBar ? a.x + BAR_DX : a.x + a.w / 2;
    if (b.x === a.x) {
      if (b.y >= a.y + a.h) return [[a.x + a.w / 2, a.y + a.h], [a.x + a.w / 2, b.y]];
      return [[a.x, a.y + a.h / 2], [a.x - 14, a.y + a.h / 2], [a.x - 14, cy], [b.x, cy]];
    }
    const tx = b.x > a.x ? b.x : b.x + b.w;
    if (hasBar && cy >= a.y + a.h && cy <= a.deathY) return [[sx, cy], [tx, cy]];
    if (cy >= a.y + a.h) { const y0 = hasBar ? a.deathY : a.y + a.h; return [[sx, y0], [sx, cy], [tx, cy]]; }
    const ex = b.x > a.x ? a.x + a.w : a.x, mx = (ex + tx) / 2;
    return [[ex, a.y + a.h / 2], [mx, a.y + a.h / 2], [mx, cy], [tx, cy]];
  },
  hit(wx, wy) {
    let bar = null;
    for (const n of this.list) {
      if (wx >= n.x && wx <= n.x + n.w && wy >= n.y && wy <= n.y + n.h) return n;
      if (n.deathY !== null && Math.abs(wx - (n.x + BAR_DX)) <= 6 && wy >= n.y && wy <= n.deathY) bar = n;
    }
    return bar;
  }
};

/* =====================================================================
 * VIEW: estado de zoom/pan e agendamento de quadros
 * ===================================================================== */
const MIN_ZOOM = 0.004, MAX_ZOOM = 2.5, DOM_ZOOM = 0.5;
const View = {
  s: 0.85, tx: 36, ty: 72, w: 0, h: 0, scheduled: false, anim: null,
  request() { if (this.scheduled) return; this.scheduled = true; requestAnimationFrame(() => { this.scheduled = false; Render.frame(); }); },
  worldX(sx) { return (sx - this.tx) / this.s; },
  worldY(sy) { return (sy - this.ty) / this.s; },
  yearAt(sy) { return this.worldY(sy) / YEAR_PX; },
  screenY(year) { return year * YEAR_PX * this.s + this.ty; },
  constrain() {
    const b = Layout.bounds, m = 90;
    this.tx = clamp(this.tx, m - b.maxX * this.s, Math.max(m, this.w - m));
    this.ty = clamp(this.ty, m - b.maxY * this.s, Math.max(m, this.h - m) - b.minY * this.s);
  },
  panBy(dx, dy) { this.cancelAnim(); this.tx += dx; this.ty += dy; this.constrain(); this.persist(); this.request(); },
  zoomAt(factor, sx, sy) {
    this.cancelAnim();
    const ns = clamp(this.s * factor, MIN_ZOOM, MAX_ZOOM), wx = this.worldX(sx), wy = this.worldY(sy);
    this.s = ns; this.tx = sx - wx * ns; this.ty = sy - wy * ns;
    this.constrain(); this.persist(); this.request();
  },
  fit() {
    const b = Layout.bounds, pad = 44;
    const ww = Math.max(1, b.maxX - b.minX), wh = Math.max(1, b.maxY - b.minY);
    const s = clamp(Math.min((this.w - pad * 2) / ww, (this.h - pad * 2) / wh), MIN_ZOOM, MAX_ZOOM);
    this.animateTo(s, (this.w - ww * s) / 2 - b.minX * s, (this.h - wh * s) / 2 - b.minY * s);
  },
  center(wx, wy, s = this.s) { this.animateTo(s, this.w / 2 - wx * s, this.h / 2 - wy * s); },
  focusPerson(id) {
    const n = Layout.nodes.get(id);
    if (n) this.center(n.x + n.w / 2, n.y + n.h / 2, Math.max(this.s, 0.7));
  },
  focusYear(year) { this.center(this.worldX(this.w / 2), year * YEAR_PX); },
  cancelAnim() { if (this.anim) { cancelAnimationFrame(this.anim); this.anim = null; } },
  animateTo(s, tx, ty) {
    this.cancelAnim();
    const a = { s: this.s, tx: this.tx, ty: this.ty }, t0 = performance.now(), dur = 240;
    if (matchMedia('(prefers-reduced-motion: reduce)').matches) { this.s = s; this.tx = tx; this.ty = ty; this.persist(); this.request(); return; }
    const step = now => {
      const k = clamp((now - t0) / dur, 0, 1), e = k * (2 - k);
      this.s = a.s + (s - a.s) * e; this.tx = a.tx + (tx - a.tx) * e; this.ty = a.ty + (ty - a.ty) * e;
      Render.frame();
      if (k < 1) this.anim = requestAnimationFrame(step); else { this.anim = null; this.persist(); }
    };
    this.anim = requestAnimationFrame(step);
  },
  persist: debounce(() => { try { localStorage.setItem(VIEW_KEY, JSON.stringify({ s: View.s, tx: View.tx, ty: View.ty, sel: App.selectedId })); } catch (e) { /* preferência não essencial */ } }, 400),
  restore() {
    try {
      const v = JSON.parse(localStorage.getItem(VIEW_KEY) || 'null');
      if (v && Number.isFinite(v.s) && Number.isFinite(v.tx) && Number.isFinite(v.ty)) { this.s = clamp(v.s, MIN_ZOOM, MAX_ZOOM); this.tx = v.tx; this.ty = v.ty; if (v.sel && People.get(v.sel)) App.selectedId = v.sel; }
    } catch (e) { /* ignora */ }
  }
};

/* =====================================================================
 * RENDERIZAÇÃO: canvas para linhas e cartões distantes; DOM para os visíveis
 * ===================================================================== */
const C = { male: '#2a5a9c', maleBg: '#dfe9f7', female: '#a2386a', femaleBg: '#f8e2ed', unk: '#5f6b78', unkBg: '#e9ebee', edge: '#7b8591', inferred: '#b9a26c', union: '#b0722a', hl: '#d9921a', accent: '#0f6b6b', grid: '#ece9e2', grid2: '#dfdbd2', band: '#f6f4ee', ev: '#0f6b6b' };
const sexColor = p => p.sex === 'M' ? C.male : p.sex === 'F' ? C.female : C.unk;
const sexBg = p => p.sex === 'M' ? C.maleBg : p.sex === 'F' ? C.femaleBg : C.unkBg;
const avatarHTML = p => p.avatar && validAvatar(p.avatar) ? `<img src="${esc(p.avatar)}" alt="">` : esc((p.name.trim()[0] || '?').toUpperCase());

const Render = {
  cards: new Map(), rulerHits: [],
  fitCanvas(c) {
    const r = c.getBoundingClientRect(), dpr = Math.min(window.devicePixelRatio || 1, 2);
    const w = Math.max(1, Math.round(r.width * dpr)), h = Math.max(1, Math.round(r.height * dpr));
    if (c.width !== w || c.height !== h) { c.width = w; c.height = h; }
    const ctx = c.getContext('2d');
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    return { ctx, w: r.width, h: r.height };
  },
  tickSteps() {
    const ppy = View.s * YEAR_PX, steps = [10, 50, 100, 500, 1000, 5000, 10000];
    const minor = steps.find(t => t * ppy >= 7) || 10000;
    const label = steps.find(t => t * ppy >= 30) || 10000;
    return { minor, label, ppy };
  },
  yearRange(h) {
    const b = Layout.bounds;
    return { a: Math.max(View.yearAt(0), b.minY / YEAR_PX - 50), b: Math.min(View.yearAt(h), b.maxY / YEAR_PX + 50) };
  },
  fillYears(ctx, from, to, range, w) {
    const a = View.screenY(Math.max(from, range.a)), b = View.screenY(Math.min(to, range.b));
    if (b > a) ctx.fillRect(0, a, w, b - a);
  },
  frame() {
    const st = $('#stage').getBoundingClientRect();
    View.w = st.width; View.h = st.height;
    this.drawTree(); this.positionCards(); this.drawRuler(); this.drawMinimap();
    $('#zoomLabel').textContent = View.s < 0.01 ? '<1%' : Math.round(View.s * 100) + '%';
  },
  isDim(id) { return !!App.highlight && !App.highlight.set.has(id); },

  drawTree() {
    const { ctx, w, h } = this.fitCanvas($('#treeCanvas'));
    ctx.clearRect(0, 0, w, h);
    const s = View.s, tx = View.tx, ty = View.ty;
    const X = x => x * s + tx, Y = y => y * s + ty;
    const { minor, label } = this.tickSteps();
    const range = this.yearRange(h);
    // Faixas de milênio e grade
    for (let m = Math.floor(range.a / 1000) * 1000; m <= range.b; m += 1000) {
      if (Math.abs(m / 1000) % 2 === 1) { ctx.fillStyle = C.band; this.fillYears(ctx, m, m + 1000, range, w); }
    }
    ctx.lineWidth = 1;
    for (let y = Math.ceil(range.a / minor) * minor; y <= range.b; y += minor) {
      const major = y % label === 0;
      if (!major && minor * s * YEAR_PX < 14) continue;
      ctx.strokeStyle = y % 1000 === 0 ? '#cfcabf' : major ? C.grid2 : C.grid;
      const sy = Math.round(View.screenY(y)) + .5;
      ctx.beginPath(); ctx.moveTo(0, sy); ctx.lineTo(w, sy); ctx.stroke();
    }
    // Eventos atravessam a árvore como linhas discretas
    ctx.setLineDash([3, 5]);
    for (const e of Events.all()) {
      const yy = Events.years(e);
      if (yy.start === null) continue;
      const sy = View.screenY(yy.start);
      if (sy < -2 || sy > h + 2) continue;
      ctx.strokeStyle = e.id === App.selectedEventId ? C.accent : 'rgba(15,107,107,.27)';
      ctx.beginPath(); ctx.moveTo(0, sy); ctx.lineTo(w, sy); ctx.stroke();
    }
    ctx.setLineDash([]);
    if (Layout.undatedBandY !== null) {
      const sy = Y(Layout.undatedBandY);
      if (sy < h) {
        ctx.fillStyle = 'rgba(95,107,120,.08)'; ctx.fillRect(0, sy, w, h - sy);
        ctx.fillStyle = '#5f6b78'; ctx.font = '12px "Segoe UI",sans-serif';
        ctx.fillText('Sem referência cronológica: fora da escala de tempo', 12, sy + 16);
      }
    }

    const inView = (x1, y1, x2, y2) => !(Math.max(x1, x2) < -30 || Math.min(x1, x2) > w + 30 || Math.max(y1, y2) < -30 || Math.min(y1, y2) > h + 30);
    const hlSet = App.highlight ? App.highlight.set : null;
    const drawEdge = (e, emph) => {
      const pts = e.path;
      let minx = Infinity, maxx = -Infinity, miny = Infinity, maxy = -Infinity;
      for (const q of pts) { const a = X(q[0]), b = Y(q[1]); if (a < minx) minx = a; if (a > maxx) maxx = a; if (b < miny) miny = b; if (b > maxy) maxy = b; }
      if (!inView(minx, miny, maxx, maxy)) return;
      const k = e.link.kind;
      ctx.setLineDash(k === 'adoptive' ? [7, 4] : k === 'other' ? [2, 4] : []);
      ctx.strokeStyle = emph ? C.hl : e.link.evidence === 'inferred' ? C.inferred : C.edge;
      ctx.globalAlpha = hlSet && !emph ? 0.13 : 1;
      ctx.lineWidth = emph ? 2.6 : Math.max(1, 1.5 * Math.min(s + .25, 1));
      ctx.beginPath();
      ctx.moveTo(X(pts[0][0]), Y(pts[0][1]));
      for (let i = 1; i < pts.length; i++) ctx.lineTo(X(pts[i][0]), Y(pts[i][1]));
      ctx.stroke();
      const last = pts[pts.length - 1];
      if (s >= 0.2) { ctx.setLineDash([]); ctx.fillStyle = ctx.strokeStyle; ctx.beginPath(); ctx.arc(X(pts[0][0]), Y(pts[0][1]), 2.4, 0, 7); ctx.fill(); ctx.beginPath(); ctx.arc(X(last[0]), Y(last[1]), 2.4, 0, 7); ctx.fill(); }
    };
    for (const e of Layout.edges) if (!(hlSet && hlSet.has(e.a.id) && hlSet.has(e.b.id))) drawEdge(e, false);
    if (hlSet) for (const e of Layout.edges) if (hlSet.has(e.a.id) && hlSet.has(e.b.id)) drawEdge(e, true);
    ctx.setLineDash([]); ctx.globalAlpha = 1;

    // Uniões: linha dupla, distinguível sem cor
    for (const u of Layout.unionEdges) {
      const x1 = X(u.a.x + u.a.w), y1 = Y(u.a.y + u.a.h * .4), x2 = X(u.b.x), y2 = Y(u.b.y + u.b.h * .4);
      if (!inView(x1, y1, x2, y2)) continue;
      const dim = hlSet && !(hlSet.has(u.a.id) && hlSet.has(u.b.id));
      ctx.globalAlpha = dim ? .13 : 1;
      ctx.strokeStyle = C.union; ctx.lineWidth = Math.max(1, 1.1 * Math.min(s + .3, 1));
      ctx.setLineDash(u.union.kind === 'marriage' ? [] : [5, 4]);
      const mx = (x1 + x2) / 2, gap = Math.max(1.3, 2.4 * Math.min(s, 1));
      for (const off of [-gap, gap]) { ctx.beginPath(); ctx.moveTo(x1, y1 + off); ctx.bezierCurveTo(mx, y1 + off, mx, y2 + off, x2, y2 + off); ctx.stroke(); }
    }
    ctx.setLineDash([]); ctx.globalAlpha = 1;

    // Barras de vida
    for (const n of Layout.list) {
      const x = X(n.x + BAR_DX), y1 = Y(n.y), p = n.p;
      if (x < -20 || x > w + 20) continue;
      const dim = this.isDim(n.id);
      if (n.deathY !== null) {
        const y2 = Y(n.deathY);
        if (y2 < -20 || y1 > h + 20) continue;
        ctx.globalAlpha = dim ? .13 : .82;
        ctx.strokeStyle = sexColor(p); ctx.lineWidth = Math.max(2, 5 * Math.min(s + .1, 1));
        ctx.setLineDash(p.death.precision === 'estimated' || p.death.precision === 'approximate' || n.undated ? [8, 5] : []);
        ctx.beginPath(); ctx.moveTo(x, y1); ctx.lineTo(x, y2); ctx.stroke();
        ctx.setLineDash([]);
        ctx.lineWidth = 2; ctx.beginPath(); ctx.moveTo(x - 6, y2); ctx.lineTo(x + 6, y2); ctx.stroke();
        if (s >= 0.34 && y2 > Y(n.y + n.h)) { ctx.fillStyle = '#4c5763'; ctx.font = '11px "Segoe UI",sans-serif'; ctx.fillText(`† ${Chrono.format(p.death.year)}`, x + 9, y2 + 4); }
      } else if (!n.undated) {
        const y2 = Y(n.y + n.h + 24);
        if (y2 < -20 || y1 > h + 20) continue;
        ctx.globalAlpha = dim ? .13 : .6;
        ctx.strokeStyle = sexColor(p); ctx.lineWidth = Math.max(2, 4 * Math.min(s + .1, 1)); ctx.setLineDash([3, 4]);
        ctx.beginPath(); ctx.moveTo(x, y1); ctx.lineTo(x, y2); ctx.stroke(); ctx.setLineDash([]);
      }
    }
    ctx.globalAlpha = 1;

    // Cartões simplificados quando o zoom é baixo demais para o DOM
    if (s < DOM_ZOOM) {
      ctx.textBaseline = 'middle';
      for (const n of Layout.list) {
        const x = X(n.x), y = Y(n.y), cw = n.w * s, ch = Math.max(3, n.h * s);
        if (x + cw < 0 || x > w || y + ch < 0 || y > h) continue;
        const p = n.p, sel = n.id === App.selectedId, dim = this.isDim(n.id);
        ctx.globalAlpha = dim ? .2 : 1;
        ctx.fillStyle = sexBg(p); ctx.strokeStyle = sel ? C.accent : hlSet && hlSet.has(n.id) ? C.hl : sexColor(p);
        ctx.lineWidth = sel || (hlSet && hlSet.has(n.id)) ? 2.5 : 1;
        if (n.undated) ctx.setLineDash([3, 2]);
        const rad = p.sex === 'F' ? Math.min(ch / 2, cw / 2) : p.sex === 'M' ? 0.5 : Math.min(3, ch / 3);
        ctx.beginPath();
        if (ctx.roundRect) ctx.roundRect(x, y, cw, ch, rad); else ctx.rect(x, y, cw, ch);
        ctx.fill(); ctx.stroke(); ctx.setLineDash([]);
        if (cw >= 34 && ch >= 10) {
          const fs = clamp(13 * s + 3.5, 9, 12);
          ctx.fillStyle = '#1e2732'; ctx.font = `600 ${fs}px "Segoe UI",sans-serif`;
          ctx.save(); ctx.beginPath(); ctx.rect(x + 3, y, cw - 6, ch); ctx.clip();
          ctx.fillText(`${VOC.sexIcon[p.sex]} ${p.name}`, x + 5, y + (ch >= 28 ? ch * .34 : ch / 2));
          if (ch >= 28) { ctx.font = `${Math.max(9, fs - 1.5)}px "Segoe UI",sans-serif`; ctx.fillStyle = '#4c5763'; ctx.fillText(Chrono.lifeText(p), x + 5, y + ch * .7); }
          ctx.restore();
        }
      }
      ctx.textBaseline = 'alphabetic'; ctx.globalAlpha = 1;
    }
  },

  cardHTML(n) {
    const p = n.p, a = Chrono.age(p), dis = People.disambiguator(p);
    const basis = p.birth.year !== null ? VOC.basisIcon[p.birth.basis] : '';
    const meta = n.undated ? 'Posição ilustrativa' :
      [a.value !== null ? plural(a.value, 'ano', 'anos') : null, p.birth.basis !== 'unknown' ? `${basis} ${p.birth.basis === 'calculated' ? 'calculado' : p.birth.basis === 'explicit' ? 'explícito' : p.birth.basis === 'inferred' ? 'inferido' : p.birth.basis === 'estimated' ? 'estimado' : 'informado'}` : null].filter(Boolean).join(' · ');
    return `<div class="avatar">${avatarHTML(p)}</div><div class="cbody">
      <div class="cname" title="${esc(p.name)}"><span class="sexicon" aria-label="${esc(VOC.sex[p.sex])}">${VOC.sexIcon[p.sex]}</span>${esc(p.name)}</div>
      ${dis ? `<div class="csub">${esc(dis)}</div>` : ''}
      <div class="cdates">${esc(Chrono.lifeText(p))}</div>
      ${dis && n.undated ? '' : `<div class="cmeta">${esc(meta)}</div>`}
    </div>
    <div class="cactions">
      <button data-act="add-child" data-id="${esc(p.id)}" title="Adicionar filho(a)">+ Filho(a)</button>
      <button data-act="add-spouse" data-id="${esc(p.id)}" title="Adicionar cônjuge">+ Cônjuge</button>
      <button data-act="add-parent" data-id="${esc(p.id)}" title="Adicionar pai ou mãe">+ Pai/Mãe</button>
      <button data-act="add-sibling" data-id="${esc(p.id)}" title="Adicionar irmão ou irmã">+ Irmão(ã)</button>
    </div>`;
  },
  resetCards() { $('#cardLayer').textContent = ''; this.cards.clear(); },
  cardClass(n) {
    const hl = App.highlight;
    return 'card ' + (n.p.sex === 'M' ? 'male' : n.p.sex === 'F' ? 'female' : 'unknownsex') + (n.undated ? ' undated' : '') +
      (n.id === App.selectedId ? ' sel' : '') + (hl && !hl.set.has(n.id) ? ' dim' : '') + (hl && hl.set.has(n.id) && n.id !== App.selectedId ? ' hl' : '');
  },
  syncCardStates() { for (const [id, el] of this.cards) { const n = Layout.nodes.get(id); if (n) el.className = this.cardClass(n); } },
  positionCards() {
    const layer = $('#cardLayer'), s = View.s;
    if (s < DOM_ZOOM) { if (this.cards.size) this.resetCards(); return; }
    const pad = 110, used = new Set();
    for (const n of Layout.list) {
      const x = n.x * s + View.tx, y = n.y * s + View.ty;
      if (x + n.w * s < -pad || x > View.w + pad || y + n.h * s < -pad || y > View.h + pad) continue;
      used.add(n.id);
      let el = this.cards.get(n.id);
      if (!el) {
        el = document.createElement('div');
        el.className = this.cardClass(n);
        el.dataset.id = n.id; el.tabIndex = 0;
        el.setAttribute('role', 'button');
        el.setAttribute('aria-label', `${n.p.name}, ${Chrono.lifeText(n.p)}`);
        el.innerHTML = this.cardHTML(n);
        layer.appendChild(el);
        this.cards.set(n.id, el);
      }
      el.style.transform = `translate(${x.toFixed(1)}px,${y.toFixed(1)}px) scale(${s})`;
    }
    for (const [id, el] of this.cards) if (!used.has(id)) { el.remove(); this.cards.delete(id); }
  },

  drawRuler() {
    const canvas = $('#rulerCanvas'), { ctx, w, h } = this.fitCanvas(canvas);
    ctx.clearRect(0, 0, w, h);
    const compact = w < 120, axis = compact ? 60 : 62;
    const { minor, label } = this.tickSteps();
    const range = this.yearRange(h);
    const hits = [];
    for (let m = Math.floor(range.a / 1000) * 1000; m <= range.b; m += 1000) {
      if (Math.abs(m / 1000) % 2 === 1) { ctx.fillStyle = '#efece4'; this.fillYears(ctx, m, m + 1000, range, w); }
    }
    // Vida da pessoa selecionada
    const sel = App.selectedId && Layout.nodes.get(App.selectedId);
    if (sel && !sel.loose) {
      const y1 = sel.y * View.s + View.ty, y2 = (sel.deathY !== null ? sel.deathY : sel.y + sel.h) * View.s + View.ty;
      ctx.fillStyle = 'rgba(15,107,107,.14)'; ctx.fillRect(axis, y1, w - axis, y2 - y1);
    }
    ctx.strokeStyle = '#9aa1a9'; ctx.lineWidth = 1;
    ctx.beginPath(); ctx.moveTo(axis + .5, 0); ctx.lineTo(axis + .5, h); ctx.stroke();
    ctx.textAlign = 'right'; ctx.textBaseline = 'middle';
    for (let y = Math.ceil(range.a / minor) * minor; y <= range.b; y += minor) {
      const sy = Math.round(View.screenY(y)) + .5;
      const mil = y % 1000 === 0, half = y % 500 === 0, cent = y % 100 === 0, fifty = y % 50 === 0;
      const len = mil ? 16 : half ? 12 : cent ? 9 : fifty ? 6 : 3;
      ctx.strokeStyle = mil ? '#39434e' : cent ? '#6b7581' : '#a6acb3'; ctx.lineWidth = mil ? 2 : 1;
      ctx.beginPath(); ctx.moveTo(axis - len, sy); ctx.lineTo(axis, sy); ctx.stroke();
      if (y % label === 0) {
        ctx.fillStyle = mil ? '#1e2732' : cent ? '#39434e' : '#5d6875';
        ctx.font = (mil ? '700 ' : cent ? '600 ' : '') + (compact ? '10px' : '11px') + ' "Segoe UI",sans-serif';
        const text = Store.doc.settings.calendar === 'AM' ? String(y) : Chrono.format(y).replace(' a.C.', ' aC').replace(' d.C.', ' dC');
        ctx.fillText(text, axis - len - 3, sy);
        if (mil && y > 0 && !compact && label >= 100) { ctx.font = '9px "Segoe UI",sans-serif'; ctx.fillStyle = '#5d6875'; ctx.fillText(`início ${y / 1000 + 1}º mil.`, axis - 3, sy + 11); }
      }
    }
    ctx.textAlign = 'left';
    // Eventos com data: rótulos são omitidos quando não cabem, mas o marcador permanece
    const relatedIds = new Set(App.selectedId ? (Index.eventsOf.get(App.selectedId) || []).map(e => e.id) : []);
    const dated = Events.sorted().filter(e => Events.years(e).start !== null);
    const placed = [];
    const items = dated.map(e => ({ e, y: Events.years(e), sy: View.screenY(Events.years(e).start) })).filter(i => i.sy + (i.y.end - i.y.start) * YEAR_PX * View.s > -10 && i.sy < h + 10);
    items.sort((a, b) => (b.e.id === App.selectedEventId) - (a.e.id === App.selectedEventId) || relatedIds.has(b.e.id) - relatedIds.has(a.e.id) || a.sy - b.sy);
    const overlaps = y => placed.some(q => Math.abs(q - y) < 13);
    for (const it of items) {
      const on = it.e.id === App.selectedEventId || relatedIds.has(it.e.id);
      const inferred = it.e.basis === 'inferred' || it.e.basis === 'estimated';
      const colr = on ? '#a65d00' : C.ev;
      if (it.y.end > it.y.start) {
        const y2 = View.screenY(it.y.end);
        ctx.fillStyle = on ? 'rgba(166,93,0,.55)' : 'rgba(15,107,107,.35)';
        ctx.fillRect(axis + 2, it.sy, 4, Math.max(2, y2 - it.sy));
      }
      ctx.fillStyle = inferred ? '#fff' : colr; ctx.strokeStyle = colr; ctx.lineWidth = 1.5;
      const dx = axis + 4, r = on ? 5 : 4;
      ctx.beginPath(); ctx.moveTo(dx, it.sy - r); ctx.lineTo(dx + r, it.sy); ctx.lineTo(dx, it.sy + r); ctx.lineTo(dx - r, it.sy); ctx.closePath(); ctx.fill(); ctx.stroke();
      hits.push({ e: it.e, x1: axis - 4, x2: dx + r + 2, y1: it.sy - 7, y2: it.sy + 7 });
      if (compact) continue;
      let ly = it.sy;
      if (overlaps(ly)) { const alt = [ly + 13, ly - 13, ly + 26, ly - 26].find(v => !overlaps(v) && v > 44); if (alt === undefined) continue; ly = alt; }
      placed.push(ly);
      ctx.font = (on ? '600 ' : '') + '11px "Segoe UI",sans-serif';
      ctx.fillStyle = on ? '#7c4600' : '#23505a';
      const maxW = w - dx - 12;
      let t = it.e.name;
      if (ctx.measureText(t).width > maxW) { while (t.length > 3 && ctx.measureText(t + '…').width > maxW) t = t.slice(0, -1); t += '…'; }
      ctx.textBaseline = 'middle'; ctx.fillText(t, dx + 8, ly);
      hits.push({ e: it.e, x1: dx + 6, x2: w, y1: ly - 7, y2: ly + 7 });
    }
    if (Layout.undatedBandY !== null) {
      const sy = Layout.undatedBandY * View.s + View.ty;
      if (sy < h) { ctx.fillStyle = 'rgba(95,107,120,.14)'; ctx.fillRect(0, sy, w, h - sy); ctx.fillStyle = '#39434e'; ctx.font = '600 11px "Segoe UI",sans-serif'; ctx.fillText('Sem data', 8, sy + 14); }
    }
    // Guia do cursor
    if (App.hoverYear !== null) {
      const sy = View.screenY(App.hoverYear);
      ctx.fillStyle = C.accent; ctx.fillRect(0, sy - .5, w, 1);
      ctx.font = '600 10px "Segoe UI",sans-serif';
      const txt = Chrono.format(Math.round(App.hoverYear));
      const tw = ctx.measureText(txt).width;
      ctx.fillStyle = C.accent; ctx.fillRect(2, sy - 8, tw + 8, 16);
      ctx.fillStyle = '#fff'; ctx.fillText(txt, 6, sy);
    }
    ctx.textBaseline = 'alphabetic';
    this.rulerHits = hits;
  },

  miniGeom(w, h) {
    const b = Layout.bounds, m = 5;
    const bw = Math.max(1, b.maxX - b.minX), bh = Math.max(1, b.maxY - b.minY);
    const k = Math.min((w - m * 2) / bw, (h - m * 2) / bh);
    return { k, ox: m + ((w - m * 2) - bw * k) / 2 - b.minX * k, oy: m + ((h - m * 2) - bh * k) / 2 - b.minY * k };
  },
  drawMinimap() {
    const c = $('#minimap');
    if (!Layout.list.length) { c.hidden = true; return; }
    c.hidden = false;
    const { ctx, w, h } = this.fitCanvas(c), g = this.miniGeom(w, h);
    ctx.clearRect(0, 0, w, h);
    for (const n of Layout.list) {
      ctx.fillStyle = n.id === App.selectedId ? C.accent : this.isDim(n.id) ? '#d7d9dc' : App.highlight ? C.hl : sexColor(n.p);
      const x = n.x * g.k + g.ox, y = n.y * g.k + g.oy;
      ctx.fillRect(x, y, Math.max(1.5, n.w * g.k * .75), Math.max(1.5, (n.deathY !== null ? n.deathY - n.y : n.h) * g.k));
    }
    ctx.strokeStyle = C.accent; ctx.lineWidth = 1.5; ctx.fillStyle = 'rgba(15,107,107,.08)';
    const vx = View.worldX(0) * g.k + g.ox, vy = View.worldY(0) * g.k + g.oy;
    const vw = View.w / View.s * g.k, vh = View.h / View.s * g.k;
    ctx.fillRect(vx, vy, vw, vh); ctx.strokeRect(vx, vy, vw, vh);
  }
};

/* =====================================================================
 * SELETOR DE PESSOAS (pesquisável, adequado a milhares de registros)
 * ===================================================================== */
function PersonPicker(host, opts = {}) {
  host.classList.add('picker');
  host.innerHTML = `<input type="text" placeholder="${esc(opts.placeholder || 'Digite para buscar…')}" autocomplete="off" aria-label="${esc(opts.aria || opts.placeholder || 'Pessoa')}"><button type="button" class="clr" title="Limpar" aria-label="Limpar seleção" hidden>×</button><div class="pick-list" hidden></div>`;
  const input = $('input', host), list = $('.pick-list', host), clr = $('.clr', host);
  let value = null, active = -1, items = [];
  const api = {
    get value() { return value; },
    set(id) {
      const p = id ? People.get(id) : null;
      value = p ? p.id : null;
      input.value = p ? People.label(p) : '';
      clr.hidden = !p;
      if (opts.onChange) opts.onChange(value);
    }
  };
  const close = () => { list.hidden = true; active = -1; };
  const show = () => {
    const excl = new Set(opts.exclude ? opts.exclude() : []);
    items = People.search(value ? '' : input.value, 30, excl);
    list.innerHTML = items.length ? items.map((p, i) => `<div data-i="${i}">${esc(People.label(p))}<em>${esc(Chrono.lifeText(p))}${p.altNames.length ? ' · ' + esc(p.altNames.join(', ')) : ''}</em></div>`).join('') : '<em style="padding:8px;display:block">Nenhum resultado</em>';
    list.hidden = false; active = -1;
  };
  input.addEventListener('focus', show);
  input.addEventListener('input', () => { value = null; clr.hidden = true; if (opts.onChange) opts.onChange(null); show(); });
  input.addEventListener('blur', () => setTimeout(() => { close(); if (!value) input.value = ''; }, 130));
  input.addEventListener('keydown', e => {
    if (list.hidden) return;
    const rows = $$('[data-i]', list);
    if (e.key === 'ArrowDown' || e.key === 'ArrowUp') {
      e.preventDefault();
      active = clamp(active + (e.key === 'ArrowDown' ? 1 : -1), 0, rows.length - 1);
      rows.forEach((r, i) => r.classList.toggle('act', i === active));
      if (rows[active]) rows[active].scrollIntoView({ block: 'nearest' });
    } else if (e.key === 'Enter') {
      e.preventDefault();
      const it = items[active >= 0 ? active : 0];
      if (it) { api.set(it.id); close(); }
    } else if (e.key === 'Escape') { e.stopPropagation(); e.preventDefault(); close(); }
  });
  list.addEventListener('mousedown', e => {
    e.preventDefault();
    const row = e.target.closest('[data-i]');
    if (row) { api.set(items[+row.dataset.i].id); close(); input.blur(); }
  });
  clr.addEventListener('click', () => { api.set(null); input.focus(); });
  if (opts.value) api.set(opts.value);
  return api;
}

/* =====================================================================
 * DIÁLOGOS
 * ===================================================================== */
const Dialogs = {
  open(html, cls = '') {
    const d = $('#dlg');
    d.className = cls;
    d.innerHTML = `<div class="d-wrap">${html}</div>`;
    if (!d.open) d.showModal();
    return d;
  },
  close() { const d = $('#dlg'); if (d.open) d.close(); d.innerHTML = ''; },
  confirm({ title, body, ok = 'Confirmar', danger = false }) {
    return new Promise(resolve => {
      const d = $('#dlgConfirm');
      d.innerHTML = `<div class="d-wrap"><div class="d-head"><h2>${esc(title)}</h2></div><div class="d-body">${body}</div><div class="d-foot"><button class="btn" data-c="0">Cancelar</button><button class="btn ${danger ? 'solid-danger' : 'primary'}" data-c="1">${esc(ok)}</button></div></div>`;
      const done = v => { d.close(); d.innerHTML = ''; d.onclick = null; d.oncancel = null; resolve(v); };
      d.onclick = e => { const b = e.target.closest('[data-c]'); if (b) done(b.dataset.c === '1'); };
      d.oncancel = e => { e.preventDefault(); done(false); };
      d.showModal();
    });
  }
};

/* ---------- Formulário de pessoa ---------- */
const PersonForm = {

    Dialogs.open(`

      <form id="personForm" class="d-body" novalidate>

          <div class="f"><label for="f_alt">Nomes alternativos ou variações</label><input id="f_alt" type="text" value="${esc(p ? p.altNames.join(', ') : '')}" placeholder="Separe por vírgulas"></div>
          <fieldset><legend>Cronologia — deixe em branco se a data for desconhecida</legend><div class="f-grid">
            ${dateFields('birth', 'Nascimento', b)}
            ${dateFields('death', 'Falecimento', d)}
            <div class="f s2"><label for="f_stated">Idade declarada na fonte</label><input id="f_stated" type="number" min="0" step="1" value="${p && p.statedAge !== null ? p.statedAge : ''}"></div>
            <div class="f s4"><span class="lbl">Idade ao falecer</span><div id="f_agecalc" class="muted small" style="padding-top:7px"></div></div>

            <div class="f s2"><label for="f_boundsN">Fundamento dos limites</label><input id="f_boundsN" type="text" value="${esc(p ? p.boundsNote : '')}"></div>
            <div class="f"><small>Os limites orientam a posição visual sem criar uma data de nascimento.</small></div>
          </div></fieldset>
          <fieldset><legend>Pais e outros vínculos parentais</legend>
            <div id="f_parents"></div>
            <div id="f_quickParents" class="row small" style="margin-bottom:6px"></div>
            <button type="button" class="btn sm" id="f_addParentRow">+ Outro vínculo parental</button>
          </fieldset>
          <fieldset><legend>Cônjuges e uniões</legend>
            <div id="f_spouses"></div>
            <button type="button" class="btn sm" id="f_addSpouseRow">+ Cônjuge</button>
          </fieldset>
          <div class="f"><label for="f_bio">Biografia</label><textarea id="f_bio" rows="3">${esc(p ? p.bio : '')}</textarea></div>
          <div class="f"><label for="f_notes">Observações</label><textarea id="f_notes" rows="2">${esc(p ? p.notes : '')}</textarea></div>
          <div class="f s3"><label for="f_bib">Referências bíblicas</label><textarea id="f_bib" rows="3" placeholder="Uma por linha. Ex.: Gn 5:3">${esc(biblical)}</textarea></div>
          <div class="f s3"><label for="f_hist">Fontes históricas</label><textarea id="f_hist" rows="3" placeholder="Uma por linha">${esc(historical)}</textarea></div>
          <div class="f"><span class="lbl">Imagem ou avatar (opcional)</span>
            <div class="row"><div class="avatar" id="f_avatarPrev" style="border-radius:50%"></div><input id="f_avatarFile" type="file" accept="image/png,image/jpeg,image/webp,image/gif" aria-label="Selecionar imagem"><button type="button" class="btn sm" id="f_avatarClear">Remover</button></div>
          </div>
        </div>
      </form>
      <div class="d-foot"><button class="btn" data-act="dlg-close">Cancelar</button><button class="btn primary" id="f_save">Salvar</button></div>`);
    this.mount(p, flow, target);
  },

  mount(p, flow, target) {
    const selfId = p ? p.id : null;
    this.parentRows = []; this.spouseRows = [];
    const existing = p ? Relations.parentLinks(p.id) : [];
    const father = existing.find(l => l.role === 'father' && l.kind === 'biological') || null;
    const mother = existing.find(l => l.role === 'mother' && l.kind === 'biological') || null;
    this.addParentRow(father || { role: 'father', kind: 'biological', evidence: 'informed' }, selfId);
    this.addParentRow(mother || { role: 'mother', kind: 'biological', evidence: 'informed' }, selfId);
    existing.filter(l => l !== father && l !== mother).forEach(l => this.addParentRow(l, selfId));
    if (p) Relations.unions(p.id).forEach(u => this.addSpouseRow({ partnerId: Relations.partnerOf(u, p.id), kind: u.kind, evidence: u.evidence }, selfId));

    if (flow && !p) {
      const rowFor = role => this.parentRows.find(r => r.role.value === role);
      if (flow.type === 'child') {
        const role = target.sex === 'F' ? 'mother' : 'father';
        rowFor(role).picker.set(target.id);
        const spouses = Relations.spouses(target.id);
        const other = rowFor(role === 'father' ? 'mother' : 'father');
        if (spouses.length === 1) other.picker.set(spouses[0]);
        if (spouses.length > 1) {
          $('#f_quickParents').innerHTML = `<span class="muted">Outro genitor:</span> ` + spouses.map(s => `<button type="button" class="btn sm" data-qp="${esc(s)}">${esc(People.get(s).name)}</button>`).join(' ');
          $('#f_quickParents').onclick = e => { const b = e.target.closest('[data-qp]'); if (b) other.picker.set(b.dataset.qp); };
        }
      }
      if (flow.type === 'sibling') {
        Relations.parentLinks(target.id).forEach(l => {
          const r = this.parentRows.find(x => x.role.value === l.role && !x.picker.value);
          if (r) { r.picker.set(l.parentId); r.kind.value = l.kind; }
          else this.addParentRow({ parentId: l.parentId, role: l.role, kind: l.kind, evidence: 'informed' }, null);
        });
      }
      if (flow.type === 'spouse') this.addSpouseRow({ partnerId: target.id, kind: 'marriage', evidence: 'informed' }, null);
      const ex = $('#f_existing');
      const flowExclude = () => {
        const s = new Set([target.id]);
        if (flow.type === 'spouse') Relations.spouses(target.id).forEach(x => s.add(x));
        if (flow.type === 'parent') { Relations.parents(target.id).forEach(x => s.add(x)); Relations.descendantSet(target.id).forEach(x => s.add(x)); }
        if (flow.type === 'child') { Relations.children(target.id).forEach(x => s.add(x)); Relations.ancestorSet(target.id).forEach(x => s.add(x)); }
        if (flow.type === 'sibling') Relations.siblings(target.id).forEach((v, x) => s.add(x));
        return s;
      };
      const pick = PersonPicker(ex, { exclude: flowExclude, placeholder: 'Buscar pessoa existente…' });
      $('#f_linkExisting').onclick = () => {
        if (!pick.value) return this.fail('Selecione a pessoa existente a vincular.');
        try { App.applyFlowExisting(flow, pick.value); Dialogs.close(); } catch (e) { this.fail(e.message); }
      };
    }
    $('#f_addParentRow').onclick = () => this.addParentRow({ role: 'guardian', kind: 'adoptive', evidence: 'informed' }, selfId, true);
    $('#f_addSpouseRow').onclick = () => this.addSpouseRow({ kind: 'marriage', evidence: 'informed' }, selfId);
    ['#f_birthY', '#f_deathY', '#f_stated'].forEach(s => $(s).addEventListener('input', () => this.updateAge()));
    // Ao digitar um ano desconhecido antes, precisão e base deixam de ser "desconhecido".
    for (const k of ['birth', 'death']) {
      $(`#f_${k}Y`).addEventListener('input', e => {
        if (e.target.value !== '' && $(`#f_${k}P`).value === 'unknown') $(`#f_${k}P`).value = 'exact';
        if (e.target.value !== '' && $(`#f_${k}B`).value === 'unknown') $(`#f_${k}B`).value = 'informed';
        if (e.target.value === '') { $(`#f_${k}P`).value = 'unknown'; $(`#f_${k}B`).value = 'unknown'; }
      });
    }
    this.updateAge(); this.renderAvatar();
    $('#f_avatarFile').addEventListener('change', e => this.readAvatar(e.target.files[0]));
    $('#f_avatarClear').onclick = () => { this.avatar = null; $('#f_avatarFile').value = ''; this.renderAvatar(); };
    $('#personForm').addEventListener('submit', e => { e.preventDefault(); this.save(); });
    $('#f_save').onclick = () => this.save();
    if (!p) setTimeout(() => $('#f_name') && $('#f_name').focus(), 30);
  },

  addParentRow(l, selfId, focus) {
    const row = document.createElement('div');
    row.className = 'linkrow';
    row.innerHTML = `<select aria-label="Papel" class="r">${options(VOC.linkRole, l.role)}</select><div class="p wide"></div><select aria-label="Natureza da relação" class="k" title="Natureza da relação">${options(VOC.linkKind, l.kind)}</select><select aria-label="Evidência" class="e" title="Evidência do vínculo">${options(VOC.evidence, l.evidence)}</select><button type="button" class="d-x" aria-label="Remover linha" title="Remover">×</button>`;
    $('#f_parents').appendChild(row);
    const exclude = () => { const s = new Set(selfId ? Relations.descendantSet(selfId) : []); if (selfId) s.add(selfId); return s; };
    const picker = PersonPicker($('.p', row), { value: l.parentId, exclude, placeholder: 'Sem registro' });
    const entry = { id: l.id || null, el: row, picker, role: $('.r', row), kind: $('.k', row), evidence: $('.e', row), note: l.note || '', orig: l.parentId || null };
    this.parentRows.push(entry);
    $('button.d-x', row).onclick = () => { row.remove(); this.parentRows = this.parentRows.filter(x => x !== entry); };
    if (focus) $('input', row).focus();
  },
  addSpouseRow(u, selfId) {
    const row = document.createElement('div');
    row.className = 'linkrow nor';
    row.innerHTML = `<div class="p wide"></div><select aria-label="Tipo de união" class="k">${options(VOC.unionKind, u.kind)}</select><select aria-label="Evidência" class="e">${options(VOC.evidence, u.evidence)}</select><button type="button" class="d-x" aria-label="Remover linha" title="Remover">×</button>`;
    $('#f_spouses').appendChild(row);
    const picker = PersonPicker($('.p', row), { value: u.partnerId, exclude: () => selfId ? [selfId] : [], placeholder: 'Buscar cônjuge…' });
    const entry = { el: row, picker, kind: $('.k', row), evidence: $('.e', row) };
    this.spouseRows.push(entry);
    $('button.d-x', row).onclick = () => { row.remove(); this.spouseRows = this.spouseRows.filter(x => x !== entry); };
  },
  updateAge() {
    const b = toInt($('#f_birthY').value), d = toInt($('#f_deathY').value), s = toInt($('#f_stated').value);
    const el = $('#f_agecalc');
    if (b !== null && d !== null) {
      const v = d - b;
      el.textContent = v < 0 ? 'Falecimento anterior ao nascimento.' : `${plural(v, 'ano', 'anos')} (calculada pelas datas)` + (s !== null && Math.abs(v - s) > 1 ? ` — difere da declarada (${s})` : '');
    } else el.textContent = s !== null ? `${plural(s, 'ano', 'anos')} (declarada na fonte)` : 'Não é possível calcular.';
  },
  renderAvatar() { const el = $('#f_avatarPrev'); el.innerHTML = this.avatar ? `<img src="${esc(this.avatar)}" alt="Prévia">` : '?'; },
  readAvatar(file) {
    if (!file) return;
    const url = URL.createObjectURL(file), img = new Image();
    img.onload = () => {
      const c = document.createElement('canvas'), size = 96, k = Math.max(size / img.width, size / img.height);
      c.width = c.height = size;
      c.getContext('2d').drawImage(img, (size - img.width * k) / 2, (size - img.height * k) / 2, img.width * k, img.height * k);
      this.avatar = c.toDataURL('image/jpeg', .82);
      URL.revokeObjectURL(url); this.renderAvatar();
    };
    img.onerror = () => { URL.revokeObjectURL(url); this.fail('Não foi possível ler a imagem selecionada.'); };
    img.src = url;
  },
  fail(msg) { const el = $('#f_error'); el.textContent = msg; el.hidden = false; el.scrollIntoView({ block: 'nearest' }); },
  save() {
    const { id, flow } = this.ctx, val = s => $(s).value;
    const yearField = s => {
      const raw = val(s);
      if (raw === '') return null;
      const n = toInt(raw);
      if (n === null) throw new Error('Os anos devem ser números inteiros.');
      return n;
    };
    const lines = s => val(s).split('\n').map(x => x.trim()).filter(Boolean);
    try {
      const data = {
        name: val('#f_name').trim(), sex: val('#f_sex'),
        altNames: val('#f_alt').split(',').map(s => s.trim()).filter(Boolean),
        birth: { year: yearField('#f_birthY'), precision: val('#f_birthP'), basis: val('#f_birthB'), note: val('#f_birthN').trim() },
        death: { year: yearField('#f_deathY'), precision: val('#f_deathP'), basis: val('#f_deathB'), note: val('#f_deathN').trim() },
        statedAge: yearField('#f_stated'), birthAfter: yearField('#f_after'), birthBefore: yearField('#f_before'), boundsNote: val('#f_boundsN').trim(),
        bio: val('#f_bio'), notes: val('#f_notes'),
        sources: lines('#f_bib').map(ref => ({ ref, type: 'biblical' })).concat(lines('#f_hist').map(ref => ({ ref, type: 'historical' }))),
        avatar: this.avatar
      };
      for (const k of ['birth', 'death']) {
        if (data[k].year === null) { data[k].precision = 'unknown'; data[k].basis = 'unknown'; }
        else if (data[k].precision === 'unknown') data[k].precision = 'approximate';
      }
      if (!data.name) { $('#f_name').focus(); throw new Error('Informe o nome da pessoa.'); }
      const parentRows = this.parentRows.filter(r => r.picker.value).map(r => {
        const prev = r.picker.value === r.orig ? r.id : null;
        return { id: prev, parentId: r.picker.value, role: r.role.value, kind: r.kind.value, evidence: r.evidence.value, note: prev ? r.note : '' };
      });
      const spouseRows = this.spouseRows.filter(r => r.picker.value).map(r => ({ partnerId: r.picker.value, kind: r.kind.value, evidence: r.evidence.value }));
      const snapshot = Store.snapshot();
      let person;
      try {
        person = id ? People.update(id, data) : People.add(data);
        Relations.replacePersonLinks(person.id, parentRows, spouseRows);
        if (flow && !id && flow.type === 'parent') {
          Relations.addParent(flow.targetId, person.id, { role: person.sex === 'F' ? 'mother' : person.sex === 'M' ? 'father' : 'guardian' });
        }
      } catch (err) {
        Store.doc = JSON.parse(snapshot); Index.rebuild(Store.doc); // transação: nada fica pela metade
        throw err;
      }
      Dialogs.close();
      App.selectedId = person.id; App.selectedEventId = null;
      App.changed();
      View.focusPerson(person.id);
      toast(id ? 'Alterações salvas.' : `${person.name} cadastrado(a).`);
    } catch (e) { this.fail(e.message); }
  }
};

    const people = new Set(e.personIds);
    const paintPeople = () => {
      $('#ef_people').innerHTML = people.size ? Array.from(people).map(pid => { const p = People.get(pid); return p ? `<span class="chip">${esc(People.label(p))} <button type="button" data-rm="${esc(pid)}" style="border:0;background:none;padding:0 2px" aria-label="Remover ${esc(p.name)}">×</button></span>` : ''; }).join(' ') : '<span class="muted small">Nenhum personagem vinculado.</span>';
    };
    $('#ef_people').onclick = ev => { const b = ev.target.closest('[data-rm]'); if (b) { people.delete(b.dataset.rm); paintPeople(); } };
    paintPeople();
    const addP = PersonPicker($('#ef_addP'), { placeholder: 'Adicionar personagem…', exclude: () => people, onChange: v => { if (v) { people.add(v); paintPeople(); setTimeout(() => addP.set(null), 0); } } });
    const anchorP = PersonPicker($('#ef_anchorP'), { value: e.anchor ? e.anchor.personId : null, placeholder: 'Selecione…' });
    const fail = msg => { const el = $('#ef_error'); el.textContent = msg; el.hidden = false; el.scrollIntoView({ block: 'nearest' }); };
    const syncAnchor = () => { const on = !!$('#ef_anchorField').value; $('#ef_start').disabled = on; $('#ef_end').disabled = on; };
    $('#ef_anchorField').onchange = syncAnchor; syncAnchor();
    $('#ef_start').addEventListener('input', ev => {
      if (ev.target.value !== '') {
        if ($('#ef_prec').value === 'unknown') $('#ef_prec').value = 'exact';
        if ($('#ef_basis').value === 'unknown') $('#ef_basis').value = 'informed';
      }
    });
    const lines = s => $(s).value.split('\n').map(x => x.trim()).filter(Boolean);
    const save = () => {
      try {
        const af = $('#ef_anchorField').value;
        if (af && !anchorP.value) throw new Error('Selecione a pessoa de referência da data.');
        const startRaw = $('#ef_start').value, endRaw = $('#ef_end').value;
        const start = af ? null : toInt(startRaw), end = af ? null : toInt(endRaw);
        if (!af && ((startRaw !== '' && start === null) || (endRaw !== '' && end === null))) throw new Error('Os anos devem ser números inteiros.');
        const hasDate = !!af || start !== null;
        const data = {
          name: $('#ef_name').value.trim(), description: $('#ef_desc').value, start, end,
          anchor: af ? { personId: anchorP.value, field: af } : null,
          precision: hasDate ? ($('#ef_prec').value === 'unknown' ? 'approximate' : $('#ef_prec').value) : 'unknown',
          basis: hasDate ? ($('#ef_basis').value === 'unknown' ? 'informed' : $('#ef_basis').value) : 'unknown',
          note: $('#ef_note').value.trim(), personIds: Array.from(people),
          sources: lines('#ef_refs').map(ref => ({ ref, type: 'biblical' })).concat(lines('#ef_hist').map(ref => ({ ref, type: 'historical' }))),
          origin: e.origin
        };
        const saved = isNew ? Events.add(data) : Events.update(id, data);
        Dialogs.close();
        App.selectedEventId = saved.id;
        App.changed();
        const ys = Events.years(saved);
        if (ys.start !== null) View.focusYear(ys.start);
        toast('Evento salvo.');
      } catch (err) { fail(err.message); }
    };
    $('#eventForm').addEventListener('submit', ev => { ev.preventDefault(); save(); });
    $('#ef_save').onclick = save;
    if ($('#ef_del')) $('#ef_del').onclick = () => App.deleteEvent(id);
  }
};

/* ---------- Painel de detalhes ---------- */
const Panel = {
  render() {
    const el = $('#panel');

    const closeBtn = `<button id="panelClose" class="btn sm" data-act="panel-close" aria-label="Fechar painel">×</button>`;
    if (App.selectedEventId && Events.get(App.selectedEventId)) el.innerHTML = closeBtn + this.eventHTML(Events.get(App.selectedEventId));
    else if (App.selectedId && People.get(App.selectedId)) { el.innerHTML = closeBtn + this.personHTML(People.get(App.selectedId)); this.mountKin(App.selectedId); }

    el.scrollTop = App.keepPanelScroll ? top : 0;

  plink(id, extra = '') {
    const p = People.get(id);

  },
  sources(list) {
    const bib = list.filter(s => s.type === 'biblical'), his = list.filter(s => s.type === 'historical');

    return `${bib.length ? `<div class="rel-group">Bíblicas</div><div class="row">${chips(bib)}</div>` : ''}${his.length ? `<div class="rel-group">Históricas</div><div class="row">${chips(his)}</div>` : ''}`;

  dateRow(label, d, bounds) {
    let v;
    if (d.year !== null) {
      const am = Store.doc.settings.calendar === 'AM' ? '' : ` <span class="muted small">(${esc(Chrono.am(d.year))})</span>`;
      v = `<b>${esc(Chrono.dateText(d))}</b>${am} <span class="chip">${esc(VOC.precision[d.precision])}</span> ${basisChip(d.basis)}${d.note ? `<div class="small muted">${esc(d.note)}</div>` : ''}`;
    } else v = `<span class="muted">Desconhecido</span>${bounds || ''}`;
    return `<dt>${label}</dt><dd>${v}</dd>`;
  },
  personHTML(p) {
    const age = Chrono.age(p);
    let ageTxt = '<span class="muted">Não é possível calcular</span>';
    if (age.source === 'computed') ageTxt = `<b>${plural(age.value, 'ano', 'anos')}</b> <span class="small muted">calculada pelas datas${age.stated === age.value ? '; confere com a idade declarada' : ''}</span>`;
    if (age.source === 'stated') ageTxt = `<b>${plural(age.value, 'ano', 'anos')}</b> <span class="small muted">declarada na fonte</span>`;
    const bounds = [p.birthAfter !== null ? `depois de ${Chrono.format(p.birthAfter)}` : '', p.birthBefore !== null ? `antes de ${Chrono.format(p.birthBefore)}` : ''].filter(Boolean).join(' e ');
    const boundsHtml = bounds ? `<div class="small">Nasceu ${esc(bounds)}.</div>${p.boundsNote ? `<div class="small muted">${esc(p.boundsNote)}</div>` : ''}` : '';
    const parents = Relations.parentLinks(p.id);
    const spouses = Relations.unions(p.id);
    const siblings = Relations.siblings(p.id);
    const childLinks = Relations.childLinks(p.id).slice().sort((a, b) => (People.get(a.childId).birth.year ?? 1e9) - (People.get(b.childId).birth.year ?? 1e9));
    const linkChip = l => `${l.kind !== 'biological' ? `<span class="chip">${esc(VOC.linkKind[l.kind])}</span>` : ''}${l.evidence === 'inferred' || l.evidence === 'estimated' ? ' ' + basisChip(l.evidence) : ''}`;
    const groups = new Map();
    for (const l of childLinks) {
      const others = Relations.parentLinks(l.childId).filter(x => x.parentId !== p.id).map(x => x.parentId);
      const key = others[0] || '';
      if (!groups.has(key)) groups.set(key, []);
      groups.get(key).push(l);
    }
    const kids = Array.from(groups.entries()).map(([k, ls]) => `<div class="rel-group">${k ? `Com ${esc(People.label(People.get(k)))}` : 'Outro genitor não registrado'}</div><ul class="rel">${ls.map(l => `<li>${this.plink(l.childId)} ${linkChip(l)}</li>`).join('')}</ul>`).join('');
    const sibText = sid => { const k = Kinship.siblingTerm(p.id, sid, People.get(sid).sex); return `<li>${this.plink(sid)} <span class="small muted">${esc(k)}</span></li>`; };
    const events = Events.ofPerson(p.id);
    const warns = People.warnings(p);
    return `
    <div class="p-sec"><div class="p-head"><div class="avatar ${p.sex === 'M' ? '' : ''}" style="border-radius:${p.sex === 'F' ? '50%' : p.sex === 'M' ? '4px' : '10px'}">${avatarHTML(p)}</div>
      <div style="min-width:0"><h2>${esc(p.name)}</h2>
      ${People.disambiguator(p) ? `<div class="p-sub">${esc(People.disambiguator(p))}</div>` : ''}
      <div class="p-sub">${VOC.sexIcon[p.sex]} ${esc(VOC.sex[p.sex])}${p.altNames.length ? ' · ' + esc(p.altNames.join(', ')) : ''}</div>
      ${p.origin === 'seed' ? '<div class="mt8"><span class="chip seed" title="Registro bíblico inicial incluído na aplicação">Registro bíblico inicial</span></div>' : ''}</div></div>
      <div class="row mt12"><button class="btn sm" data-act="edit" data-id="${esc(p.id)}">Editar</button><button class="btn sm danger" data-act="delete" data-id="${esc(p.id)}">Excluir</button><button class="btn sm" data-act="focus" data-id="${esc(p.id)}">Centralizar</button></div>
      <div class="row mt8"><button class="btn sm" data-act="add-child" data-id="${esc(p.id)}">+ Filho(a)</button><button class="btn sm" data-act="add-spouse" data-id="${esc(p.id)}">+ Cônjuge</button><button class="btn sm" data-act="add-parent" data-id="${esc(p.id)}">+ Pai/Mãe</button><button class="btn sm" data-act="add-sibling" data-id="${esc(p.id)}">+ Irmão(ã)</button></div>
      ${warns.map(w => `<div class="warnbox">⚠ ${esc(w)}</div>`).join('')}
    </div>
    <div class="p-sec"><h3>Cronologia</h3><dl class="facts">${this.dateRow('Nascimento', p.birth, boundsHtml)}${this.dateRow('Falecimento', p.death)}<dt>Idade</dt><dd>${ageTxt}</dd></dl></div>
    <div class="p-sec"><h3>Ver na árvore</h3><div class="row">
      <button class="btn sm${this.hlOn(p.id, 'anc')}" data-act="hl-anc" data-id="${esc(p.id)}">Ancestrais</button>
      <button class="btn sm${this.hlOn(p.id, 'desc')}" data-act="hl-desc" data-id="${esc(p.id)}">Descendentes</button>
      <button class="btn sm${this.hlOn(p.id, 'both')}" data-act="hl-both" data-id="${esc(p.id)}">Ambos</button></div></div>
    <div class="p-sec"><h3>Família</h3>
      <div class="rel-group">Pais</div>${parents.length ? `<ul class="rel">${parents.map(l => `<li><span class="small muted">${esc(VOC.linkRole[l.role])}:</span> ${this.plink(l.parentId)} ${linkChip(l)}</li>`).join('')}</ul>` : '<div class="muted small">Não registrados</div>'}
      <div class="rel-group">Cônjuges</div>${spouses.length ? `<ul class="rel">${spouses.map(u => `<li>${this.plink(Relations.partnerOf(u, p.id))} <span class="small muted">${esc(VOC.unionKind[u.kind])}</span>${u.evidence === 'inferred' ? ' ' + basisChip('inferred') : ''}</li>`).join('')}</ul>` : '<div class="muted small">Não registrados</div>'}
      <div class="rel-group">Filhos (${childLinks.length})</div>${kids || '<div class="muted small">Não registrados</div>'}
      <div class="rel-group">Irmãos (${siblings.size})</div>${siblings.size ? `<ul class="rel">${Array.from(siblings.keys()).map(sibText).join('')}</ul>` : '<div class="muted small">Não registrados</div>'}
    </div>
    <div class="p-sec"><h3>Parentesco calculado</h3>
      <div id="kinPick"></div><div id="kinOut"></div>
      <details class="more mt8" id="kinAll"><summary>Listar todos os parentes</summary><div id="kinList" class="mt8"></div></details>
    </div>
    <div class="p-sec"><h3>Eventos (${events.length})</h3>${events.length ? `<ul class="rel">${events.map(e => `<li><button class="plink" data-act="event-view" data-id="${esc(e.id)}">${esc(e.name)}</button> <span class="small muted">${esc(Events.rangeText(e))}</span></li>`).join('')}</ul>` : '<span class="muted small">Nenhum evento vinculado.</span>'}</div>
    ${p.bio ? `<div class="p-sec"><h3>Biografia</h3><div class="prose">${esc(p.bio)}</div></div>` : ''}
    ${p.notes ? `<div class="p-sec"><h3>Observações</h3><div class="prose small">${esc(p.notes)}</div></div>` : ''}
    <div class="p-sec"><h3>Fontes</h3>${this.sources(p.sources)}</div>`;
  },
  hlOn(id, mode) { const h = App.highlight; return h && h.rootId === id && h.mode === mode ? ' on' : ''; },
  mountKin(id) {
    const self = People.get(id);
    PersonPicker($('#kinPick'), {
      exclude: () => [id], placeholder: 'Comparar com outra pessoa…',
      onChange: v => {
        const out = $('#kinOut');
        if (!v) { out.innerHTML = ''; return; }
        const other = People.get(v), rel = Kinship.between(id, v);
        out.innerHTML = `<div class="kin-result"><b>${esc(other.name)}</b> é ${rel.length ? rel.map(r => `<b>${esc(r.term)}</b> <span class="small muted">(${esc(r.group)}${r.civilDegree ? `, ${r.civilDegree}º grau civil` : ''}${r.ancestorId && r.up && r.down ? `; ancestral comum: ${esc(People.get(r.ancestorId).name)}` : ''})</span>`).join(' e ') : '<b>sem parentesco registrado</b>'} de ${esc(self.name)}.</div>`;
      }

    $('#kinAll').addEventListener('toggle', e => {

    });

      <div class="row"><b>${esc(Events.rangeText(e))}</b>${e.precision !== 'unknown' ? `<span class="chip">${esc(VOC.precision[e.precision])}</span>` : ''} ${basisChip(e.basis)}</div>
      ${a ? `<div class="small muted mt8">Data acompanha o ${e.anchor.field === 'birth' ? 'nascimento' : 'falecimento'} de ${esc(a.name)}.</div>` : ''}
      ${e.note ? `<div class="small muted mt8">${esc(e.note)}</div>` : ''}

    <div class="p-sec"><h3>Personagens (${e.personIds.length})</h3>${e.personIds.length ? `<ul class="rel">${e.personIds.map(id => `<li>${this.plink(id)}</li>`).join('')}</ul>` : '<span class="muted small">Nenhum personagem vinculado.</span>'}</div>
    <div class="p-sec"><h3>Fontes</h3>${this.sources(e.sources)}</div>`;

      <div class="d-body">
