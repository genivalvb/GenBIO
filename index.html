<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>GenBIO — Árvore genealógica bíblica cronológica</title>
<style>
:root{
  --bg:#f5f3ee; --surface:#fff; --surface2:#faf8f4; --ink:#1e2732; --muted:#5d6875; --faint:#8d96a1;
  --line:#dcd8cf; --line2:#ebe8e1; --accent:#0f6b6b; --accent2:#e3f1f0; --accent-ink:#0a4f4f;
  --male:#2a5a9c; --male-bg:#eef3fb; --female:#a2386a; --female-bg:#fbeff5; --unk:#5f6b78; --unk-bg:#f1f2f4;
  --union:#b0722a; --danger:#b3261e; --warn:#8a5a00; --warn-bg:#fdf3dc;
  --ruler-w:224px; --panel-w:368px; --top-h:54px;
  --shadow:0 1px 2px rgba(30,39,50,.08),0 4px 14px rgba(30,39,50,.07);
  font-family:"Segoe UI",system-ui,-apple-system,Roboto,Arial,sans-serif;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--ink);font-size:14px;overflow:hidden}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
[hidden]{display:none!important}

/* Barra superior */
#topbar{height:var(--top-h);display:flex;align-items:center;gap:10px;padding:0 12px;background:var(--surface);border-bottom:1px solid var(--line);position:relative;z-index:30}
.brand{display:flex;align-items:baseline;gap:8px;white-space:nowrap}
.brand b{font:700 20px Georgia,"Times New Roman",serif;color:var(--accent-ink);letter-spacing:.2px}
.brand span{font-size:12px;color:var(--muted)}
#searchWrap{position:relative;flex:1 1 220px;max-width:380px;min-width:110px}
#searchInput{width:100%;height:34px;border:1px solid var(--line);border-radius:8px;padding:0 10px;background:var(--surface2)}
.spacer{flex:1 1 0}
.btn{height:34px;padding:0 12px;border:1px solid var(--line);border-radius:8px;background:var(--surface);white-space:nowrap;display:inline-flex;align-items:center;gap:6px}
.btn:hover{background:var(--surface2);border-color:#c5c0b5}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#fff}
.btn.primary:hover{background:var(--accent-ink)}
.btn.danger{color:var(--danger);border-color:#e5c0bd}
.btn.danger:hover{background:#fdf0ef}
.btn.solid-danger{background:var(--danger);border-color:var(--danger);color:#fff}
.btn.sm{height:28px;padding:0 9px;font-size:13px}
.btn.on{background:var(--accent2);border-color:var(--accent);color:var(--accent-ink)}
.menu{position:relative}
.menu>summary{list-style:none}
.menu>summary::-webkit-details-marker{display:none}
.menu-list{position:absolute;right:0;top:40px;width:250px;background:var(--surface);border:1px solid var(--line);border-radius:10px;box-shadow:var(--shadow);padding:6px;z-index:40}
.menu-list button{display:block;width:100%;text-align:left;padding:8px 10px;border:0;background:none;border-radius:6px}
.menu-list button:hover{background:var(--surface2)}
.menu-list hr{border:0;border-top:1px solid var(--line2);margin:5px 0}
.menu-list .danger{color:var(--danger)}
#saveState{font-size:12px;color:var(--muted);white-space:nowrap}
#saveState.err{color:var(--danger);font-weight:600}

/* Estrutura em três regiões */
#app{position:relative;display:grid;grid-template-columns:var(--ruler-w) minmax(0,1fr) var(--panel-w);height:calc(100% - var(--top-h))}
#ruler{position:relative;background:var(--surface2);border-right:1px solid var(--line);overflow:hidden;z-index:5;touch-action:none;cursor:ns-resize}
#rulerHead{position:absolute;inset:0 0 auto 0;padding:6px 8px;background:rgba(250,248,244,.94);border-bottom:1px solid var(--line2);font-size:11px;line-height:1.3;color:var(--muted);z-index:2;cursor:pointer}
#rulerHead b{display:block;color:var(--ink);font-size:12px}
#rulerCanvas,#treeCanvas{position:absolute;inset:0;width:100%;height:100%;display:block}
#stage{position:relative;overflow:hidden;background:#fbfaf7;touch-action:none;cursor:grab;user-select:none}
#stage.panning{cursor:grabbing}
#cardLayer{position:absolute;left:0;top:0;width:0;height:0}
#panel{background:var(--surface);border-left:1px solid var(--line);overflow-y:auto;z-index:6;overscroll-behavior:contain}

/* Cartões */
.card{position:absolute;left:0;top:0;width:184px;height:66px;transform-origin:0 0;display:flex;gap:8px;align-items:center;padding:6px 8px 6px 15px;background:var(--surface);border:1.5px solid var(--unk);box-shadow:0 1px 3px rgba(30,39,50,.13);cursor:pointer;transition:opacity .12s}
.card.male{border-color:var(--male);background:var(--male-bg);border-radius:3px}
.card.female{border-color:var(--female);background:var(--female-bg);border-radius:18px}
.card.unknownsex{border-style:double;border-width:3px;background:var(--unk-bg);border-radius:9px}
.card.undated{border-style:dashed}
.card.dim{opacity:.22}
.card.hl{box-shadow:0 0 0 2px #e4a72e,0 2px 6px rgba(30,39,50,.2)}
.card.sel{box-shadow:0 0 0 3px var(--accent),0 3px 10px rgba(15,107,107,.35);z-index:3}
.avatar{flex:0 0 36px;width:36px;height:36px;display:grid;place-items:center;background:#fff;border:1px solid rgba(30,39,50,.2);font:600 15px Georgia,serif;overflow:hidden;color:var(--muted)}
.male .avatar{border-radius:3px}.female .avatar{border-radius:50%}.unknownsex .avatar{border-radius:8px}
.avatar img{width:100%;height:100%;object-fit:cover;display:block}
.cbody{min-width:0;flex:1;line-height:1.22}
.cname{font-weight:650;font-size:13.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.csub,.cdates,.cmeta{font-size:11px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.csub{color:var(--muted);font-size:10px}.cdates{color:#34404d}.cmeta{color:var(--muted);font-size:10.5px}
.sexicon{font:700 15px/1 "Segoe UI Symbol","Apple Symbols","Noto Sans Symbols",sans-serif;margin-right:3px;vertical-align:-1px}.male .sexicon{color:var(--male)}.female .sexicon{color:var(--female)}
.cactions{position:absolute;left:0;top:calc(100% + 3px);display:none;gap:2px;background:var(--surface);border:1px solid var(--line);border-radius:7px;padding:2px;box-shadow:var(--shadow);z-index:4;white-space:nowrap}
.card:hover .cactions,.card.sel .cactions,.card:focus-within .cactions{display:flex}
.cactions button{border:0;background:none;padding:2px 5px;font-size:10.5px;border-radius:4px;color:var(--accent-ink)}
.cactions button:hover{background:var(--accent2)}

/* Controles sobre a árvore */
#zoomCtl{position:absolute;left:12px;bottom:12px;display:flex;gap:4px;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:9px;padding:4px;box-shadow:var(--shadow);z-index:8;cursor:default}
#zoomCtl button{min-width:30px;height:28px;border:1px solid transparent;background:none;border-radius:6px}
#zoomCtl button:hover{background:var(--surface2);border-color:var(--line)}
#zoomLabel{min-width:42px;text-align:center;font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums}
#minimap{position:absolute;right:12px;bottom:12px;width:170px;height:112px;background:rgba(255,255,255,.93);border:1px solid var(--line);border-radius:8px;box-shadow:var(--shadow);z-index:8;cursor:crosshair}
#hlBanner{position:absolute;left:50%;top:10px;transform:translateX(-50%);max-width:calc(100% - 24px);display:flex;gap:10px;align-items:center;padding:6px 8px 6px 12px;background:#fff6df;border:1px solid #e4c678;border-radius:9px;box-shadow:var(--shadow);font-size:13px;z-index:8;cursor:default}
#emptyStage{position:absolute;inset:0;display:grid;place-items:center;z-index:7;cursor:default;text-align:center;padding:20px}
#emptyStage h2{font:600 20px Georgia,serif;margin:0 0 8px}
#emptyStage p{color:var(--muted);margin:0 0 14px}
#emptyStage .row{display:flex;gap:8px;justify-content:center;flex-wrap:wrap}
#tip{position:fixed;pointer-events:none;background:#1e2732;color:#fff;font-size:12px;line-height:1.35;padding:6px 8px;border-radius:6px;max-width:300px;z-index:100;box-shadow:var(--shadow)}
#panelClose{display:none}

/* Painel direito */
.p-sec{padding:13px 16px;border-bottom:1px solid var(--line2)}
.p-sec h3{font-size:11.5px;letter-spacing:.5px;text-transform:uppercase;color:var(--muted);margin:0 0 8px;font-weight:650}
.p-head{display:flex;gap:12px;align-items:flex-start}
.p-head .avatar{flex:0 0 58px;width:58px;height:58px;font-size:24px}
.p-head h2{font:600 20px/1.2 Georgia,serif;margin:0;overflow-wrap:anywhere}
.p-sub{font-size:12.5px;color:var(--muted);margin-top:3px}
.row{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.mt8{margin-top:8px}.mt12{margin-top:12px}
dl.facts{display:grid;grid-template-columns:auto 1fr;gap:6px 10px;margin:0}
dl.facts dt{color:var(--muted);font-size:12.5px}
dl.facts dd{margin:0;overflow-wrap:anywhere}
.chip{display:inline-block;padding:1px 7px;border-radius:999px;font-size:11px;border:1px solid var(--line);background:var(--surface2);color:#3a4653;white-space:nowrap}
.chip.explicit{background:#e6f4ea;border-color:#a6d1b2;color:#1d5c32}
.chip.calculated{background:#e8f0fb;border-color:#b0c7e8;color:#234a80}
.chip.inferred{background:#fdf3dc;border-color:#e4cf95;color:#755000}
.chip.estimated{background:#fbe9de;border-color:#eac0a3;color:#854317}
.chip.seed{background:var(--accent2);border-color:#a5d0ce;color:var(--accent-ink)}
.plink{border:0;background:none;padding:0;color:var(--accent-ink);text-decoration:underline;text-underline-offset:2px;text-align:left}
.plink:hover{color:var(--accent)}
ul.rel{list-style:none;margin:0;padding:0}
ul.rel li{padding:3px 0;display:flex;gap:6px;flex-wrap:wrap;align-items:baseline}
.rel-group{font-size:12px;color:var(--muted);margin:8px 0 2px}
.rel-group:first-child{margin-top:0}
.muted{color:var(--muted)}.small{font-size:12.5px}
.warnbox{background:var(--warn-bg);border:1px solid #ecd9a4;color:#664300;padding:7px 10px;border-radius:7px;font-size:12.5px;margin-top:6px}
.prose{white-space:pre-wrap;overflow-wrap:anywhere;line-height:1.45}
details.more>summary{cursor:pointer;color:var(--accent-ink);font-size:13px}
.kin-result{margin-top:8px;padding:8px 10px;background:var(--surface2);border:1px solid var(--line2);border-radius:7px;font-size:13px}
.legend{display:grid;grid-template-columns:44px 1fr;gap:6px 10px;align-items:center;font-size:12.5px}
.lg-card{height:22px;border:1.5px solid}
.lg-line{height:0;border-top:2px solid #6c7682}

/* Diálogos e formulários */
dialog{border:0;border-radius:13px;padding:0;background:var(--surface);color:var(--ink);box-shadow:0 12px 48px rgba(20,28,38,.32);max-width:min(760px,calc(100vw - 20px));width:100%;max-height:calc(100dvh - 24px)}
dialog.narrow{max-width:min(470px,calc(100vw - 20px))}
dialog::backdrop{background:rgba(25,33,43,.42)}
.d-wrap{display:flex;flex-direction:column;max-height:calc(100dvh - 24px)}
.d-head{display:flex;justify-content:space-between;gap:12px;align-items:center;padding:13px 18px;border-bottom:1px solid var(--line2)}
.d-head h2{font:600 18px Georgia,serif;margin:0}
.d-x{border:0;background:none;font-size:20px;line-height:1;padding:4px 8px;border-radius:6px}
.d-x:hover{background:var(--surface2)}
.d-body{padding:14px 18px;overflow:auto;flex:1}
.d-foot{display:flex;justify-content:flex-end;gap:8px;padding:11px 18px;border-top:1px solid var(--line2);flex-wrap:wrap}
.f-grid{display:grid;grid-template-columns:repeat(6,1fr);gap:10px 12px}
.f{display:flex;flex-direction:column;gap:3px;grid-column:span 6;min-width:0}
.f.s2{grid-column:span 2}.f.s3{grid-column:span 3}.f.s4{grid-column:span 4}
.f>label,.f>.lbl{font-size:12.5px;color:#3c4754;font-weight:550}
.f small{color:var(--muted);font-size:11.5px;line-height:1.3}
input[type=text],input[type=number],input[type=search],select,textarea{width:100%;min-height:33px;border:1px solid #cfcabf;border-radius:7px;padding:5px 8px;background:#fff}
textarea{resize:vertical;min-height:62px}
fieldset{grid-column:span 6;border:1px solid var(--line2);border-radius:9px;padding:10px 12px 12px;margin:0;min-width:0}
legend{font-size:12.5px;font-weight:650;color:var(--accent-ink);padding:0 5px}
.linkrow{display:grid;grid-template-columns:minmax(110px,1.4fr) minmax(0,2.2fr) minmax(0,1.2fr) minmax(0,1.2fr) auto;gap:6px;align-items:center;margin-bottom:6px}
.linkrow.nor{grid-template-columns:minmax(0,2.4fr) minmax(0,1.2fr) minmax(0,1.2fr) auto}
.form-error{background:#fdecea;border:1px solid #f1bdb8;color:#8c1d15;border-radius:7px;padding:8px 10px;margin-bottom:10px;white-space:pre-line}
.flowbar{background:var(--accent2);border:1px solid #bfdedc;border-radius:9px;padding:9px 11px;margin-bottom:12px}
.flowbar .row>div{flex:1;min-width:190px}
.picker{position:relative}
.picker input{padding-right:26px}
.picker .clr{position:absolute;right:3px;top:4px;border:0;background:none;color:var(--muted);padding:2px 6px}
.pick-list{position:absolute;left:0;right:0;top:calc(100% + 2px);background:#fff;border:1px solid var(--line);border-radius:8px;box-shadow:var(--shadow);max-height:230px;overflow:auto;z-index:50;min-width:230px}
.pick-list div{padding:6px 9px;cursor:pointer;font-size:13px}
.pick-list div.act,.pick-list div:hover{background:var(--accent2)}
.pick-list em{font-style:normal;color:var(--muted);font-size:11.5px;display:block}
.ev-item{display:flex;justify-content:space-between;gap:10px;padding:9px 4px;border-bottom:1px solid var(--line2);align-items:center}
.ev-item b{display:block}
table.calc{width:100%;border-collapse:collapse;font-size:12.5px}
table.calc th,table.calc td{padding:4px 6px;border-bottom:1px solid var(--line2);text-align:left}
#toasts{position:fixed;left:50%;bottom:18px;transform:translateX(-50%);display:flex;flex-direction:column;gap:6px;z-index:200;align-items:center;width:max-content;max-width:calc(100vw - 20px)}
.toast{background:#1e2732;color:#fff;border-radius:9px;padding:8px 12px;display:flex;gap:12px;align-items:center;box-shadow:var(--shadow);font-size:13px}
.toast.err{background:#8c1d15}
.toast button{border:1px solid rgba(255,255,255,.5);background:none;color:#fff;border-radius:6px;padding:2px 8px}

/* Responsividade */
@media (max-width:1100px){:root{--panel-w:320px;--ruler-w:170px}.brand span,#saveState{display:none}}
@media (max-width:860px){
  :root{--ruler-w:84px;--top-h:96px}
  #topbar{flex-wrap:wrap;height:var(--top-h);align-content:center;gap:6px;padding:0 8px}
  #searchWrap{order:5;flex:1 1 100%;max-width:none}
  .spacer{display:none}
  #app{grid-template-columns:var(--ruler-w) minmax(0,1fr)}
  #panel{position:absolute;right:0;top:0;bottom:0;width:min(400px,92vw);box-shadow:-6px 0 24px rgba(20,28,38,.25);transform:translateX(105%);transition:transform .18s;z-index:20}
  #panel.open{transform:none}
  #panelClose{display:inline-flex;position:sticky;top:6px;float:right;margin:6px 8px 0 0;z-index:3}
  #minimap{width:112px;height:76px}
  .f.s2,.f.s3,.f.s4{grid-column:span 3}
  .linkrow,.linkrow.nor{grid-template-columns:1fr 1fr;padding-bottom:6px;border-bottom:1px dashed var(--line2)}
  .linkrow .wide{grid-column:span 2}
  .hide-sm{display:none}
}
@media print{#topbar,#zoomCtl,#minimap{display:none}}
</style>
</head>
<body>
<header id="topbar">
  <div class="brand"><b>GenBIO</b><span>Genealogia cronológica</span></div>
  <div id="searchWrap"><input id="searchInput" type="search" placeholder="Pesquisar pessoa ou evento… ( / )" aria-label="Pesquisar pessoa ou evento" autocomplete="off"><div id="searchList" class="pick-list" hidden></div></div>
  <button class="btn primary" data-act="new-person">+ Pessoa</button>
  <button class="btn" data-act="open-events">Eventos</button>
  <button class="btn" data-act="open-lineage">Linhagem</button>
  <div class="spacer"></div>
  <span id="saveState" role="status" aria-live="polite">Salvo</span>
  <button class="btn" data-act="open-calendar" title="Sistema cronológico">Cronologia</button>
  <details class="menu" id="dataMenu">
    <summary class="btn">Dados ▾</summary>
    <div class="menu-list">
      <button data-act="export-json">Exportar JSON (backup)</button>
      <button data-act="import-json">Importar JSON…</button>
      <hr>
      <button data-act="restore-seed">Restaurar dados bíblicos iniciais…</button>
      <button class="danger" data-act="clear-data">Limpar todos os dados…</button>
      <hr>
      <button data-act="open-about">Sobre a metodologia e ajuda</button>
    </div>
  </details>
  <input id="importFile" type="file" accept=".json,application/json" hidden>
</header>
<main id="app">
  <aside id="ruler" aria-label="Régua cronológica">
    <div id="rulerHead" data-act="open-calendar" title="Alterar sistema cronológico"></div>
    <canvas id="rulerCanvas"></canvas>
  </aside>
  <section id="stage" aria-label="Árvore genealógica">
    <canvas id="treeCanvas"></canvas>
    <div id="cardLayer"></div>
    <div id="hlBanner" hidden><span id="hlText"></span><button class="btn sm" data-act="hl-clear">Limpar destaque</button></div>
    <div id="emptyStage" hidden><div><h2>Nenhuma pessoa cadastrada</h2><p>Comece um novo registro ou carregue os dados bíblicos iniciais.</p><div class="row"><button class="btn primary" data-act="new-person">+ Cadastrar pessoa</button><button class="btn" data-act="load-seed">Carregar dados bíblicos iniciais</button></div></div></div>
    <div id="zoomCtl" role="group" aria-label="Zoom">
      <button data-act="zoom-out" title="Reduzir (−)" aria-label="Reduzir zoom">−</button><span id="zoomLabel">100%</span><button data-act="zoom-in" title="Ampliar (+)" aria-label="Ampliar zoom">+</button>
      <button data-act="zoom-fit" title="Ajustar para ver toda a árvore (0)">Ajustar</button>
    </div>
    <canvas id="minimap" aria-label="Minimapa da árvore"></canvas>
  </section>
  <aside id="panel" aria-label="Detalhes"></aside>
</main>
<div id="tip" hidden></div>
<div id="toasts" role="status" aria-live="polite"></div>
<dialog id="dlg"></dialog>
<dialog id="dlgConfirm" class="narrow"></dialog>

<script>
'use strict';
(function () {

/* =====================================================================
 * UTILITÁRIOS
 * ===================================================================== */
const $ = (sel, root = document) => root.querySelector(sel);
const $$ = (sel, root = document) => Array.from(root.querySelectorAll(sel));
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const norm = s => String(s || '').normalize('NFD').replace(/[̀-ͯ]/g, '').toLowerCase().trim();
let uidCounter = 0;
const uid = prefix => `${prefix}_${Date.now().toString(36)}${(uidCounter++).toString(36)}${Math.random().toString(36).slice(2, 6)}`;
const toInt = v => {
  if (v === null || v === undefined || v === '') return null;
  const n = Number(v);
  return Number.isFinite(n) && Number.isInteger(n) ? n : null;
};
const debounce = (fn, ms) => { let t; return (...a) => { clearTimeout(t); t = setTimeout(() => fn(...a), ms); }; };
const plural = (n, one, many) => `${n} ${n === 1 ? one : many}`;

function toast(msg, opts = {}) {
  const el = document.createElement('div');
  el.className = 'toast' + (opts.error ? ' err' : '') + (opts.action ? ' undo' : '');
  el.textContent = msg;
  if (opts.action) {
    const b = document.createElement('button');
    b.textContent = opts.action.label;
    b.onclick = () => { opts.action.run(); el.remove(); };
    el.appendChild(b);
  }
  $('#toasts').appendChild(el);
  setTimeout(() => el.remove(), opts.ms || (opts.action ? 9000 : 3500));
}

/* =====================================================================
 * VOCABULÁRIOS (separados de rótulos para facilitar migração / GEDCOM)
 * ===================================================================== */
const VOC = {
  sex: { M: 'Masculino', F: 'Feminino', U: 'Não informado' },
  sexIcon: { M: '♂', F: '♀', U: '◇' },
  precision: { exact: 'Exato', approximate: 'Aproximado', estimated: 'Estimado', unknown: 'Desconhecido' },
  basis: {
    explicit: 'Explícito no texto', calculated: 'Calculado a partir do texto', inferred: 'Inferido',
    estimated: 'Estimado', informed: 'Informado pelo usuário', unknown: 'Sem informação'
  },
  basisIcon: { explicit: '§', calculated: 'Σ', inferred: '≈', estimated: '~', informed: '✎', unknown: '?' },
  linkKind: { biological: 'Biológica', adoptive: 'Adotiva', other: 'Outra' },
  linkRole: { father: 'Pai', mother: 'Mãe', guardian: 'Responsável' },
  unionKind: { marriage: 'Casamento', concubinage: 'Concubinato', other: 'Outra união' },
  evidence: { explicit: 'Explícito no texto', inferred: 'Inferido', estimated: 'Estimado', informed: 'Informado pelo usuário' }
};
const options = (map, sel) => Object.keys(map).map(k => `<option value="${k}"${k === sel ? ' selected' : ''}>${esc(map[k])}</option>`).join('');
const basisChip = b => (b && b !== 'unknown') ? `<span class="chip ${esc(b)}" title="${esc(VOC.basis[b] || '')}">${esc(VOC.basisIcon[b] || '')} ${esc(VOC.basis[b] || b)}</span>` : '';

/* =====================================================================
 * ARMAZENAMENTO: documento, validação, índices e persistência
 * ===================================================================== */
const STORAGE_KEY = 'genbio.data.v1';
const VIEW_KEY = 'genbio.view.v1';
const SCHEMA_VERSION = 1;

const emptyDoc = () => ({
  format: 'genbio', schemaVersion: SCHEMA_VERSION,
  settings: { calendar: 'AM', methodologyName: '', creationYearBC: null },
  persons: [], parentLinks: [], unions: [], events: []
});

/* Índices derivados: nunca persistidos. */
const Index = {
  persons: new Map(), parentsOf: new Map(), childrenOf: new Map(), unionsOf: new Map(), eventsOf: new Map(), events: new Map(), nameCount: new Map(),
  ancMemo: new Map(),
  rebuild(doc) {
    this.persons = new Map(doc.persons.map(p => [p.id, p]));
    this.parentsOf = new Map(); this.childrenOf = new Map(); this.unionsOf = new Map(); this.eventsOf = new Map(); this.nameCount = new Map(); this.ancMemo = new Map();
    this.events = new Map(doc.events.map(e => [e.id, e]));
    const push = (map, k, v) => { const a = map.get(k); if (a) a.push(v); else map.set(k, [v]); };
    for (const p of doc.persons) { const k = norm(p.name); this.nameCount.set(k, (this.nameCount.get(k) || 0) + 1); }
    for (const l of doc.parentLinks) { push(this.parentsOf, l.childId, l); push(this.childrenOf, l.parentId, l); }
    for (const u of doc.unions) for (const id of u.partnerIds) push(this.unionsOf, id, u);
    for (const e of doc.events) for (const id of e.personIds) push(this.eventsOf, id, e);
  }
};

const normDate = d => {
  d = d || {};
  const year = toInt(d.year);
  return {
    year,
    precision: VOC.precision[d.precision] ? d.precision : (year === null ? 'unknown' : 'exact'),
    basis: VOC.basis[d.basis] ? d.basis : (year === null ? 'unknown' : 'informed'),
    note: String(d.note || '')
  };
};
const normSources = list => (Array.isArray(list) ? list : []).map(s => typeof s === 'string' ? { ref: s, type: 'biblical' } : { ref: String((s && s.ref) || ''), type: s && s.type === 'historical' ? 'historical' : 'biblical' }).filter(s => s.ref.trim());
const validAvatar = a => (typeof a === 'string' && /^data:image\/(png|jpeg|webp|gif);base64,[a-z0-9+/=]+$/i.test(a) && a.length < 400000) ? a : null;

function normalizePerson(r) {
  return {
    id: String(r.id || uid('p')),
    name: String(r.name || '').trim(),
    sex: VOC.sex[r.sex] ? r.sex : 'U',
    altNames: (Array.isArray(r.altNames) ? r.altNames : []).map(s => String(s).trim()).filter(Boolean),
    birth: normDate(r.birth), death: normDate(r.death),
    birthAfter: toInt(r.birthAfter), birthBefore: toInt(r.birthBefore), boundsNote: String(r.boundsNote || ''),
    statedAge: toInt(r.statedAge),
    bio: String(r.bio || ''), notes: String(r.notes || ''),
    sources: normSources(r.sources), avatar: validAvatar(r.avatar),
    origin: r.origin === 'seed' ? 'seed' : 'user', seq: toInt(r.seq) || 0
  };
}
function normalizeEvent(r) {
  const anchor = r.anchor && r.anchor.personId && (r.anchor.field === 'birth' || r.anchor.field === 'death') ? { personId: String(r.anchor.personId), field: r.anchor.field } : null;
  const start = toInt(r.start);
  return {
    id: String(r.id || uid('e')), name: String(r.name || '').trim(), description: String(r.description || ''),
    start, end: toInt(r.end), anchor,
    precision: VOC.precision[r.precision] ? r.precision : (start === null && !anchor ? 'unknown' : 'exact'),
    basis: VOC.basis[r.basis] ? r.basis : (start === null && !anchor ? 'unknown' : 'informed'),
    note: String(r.note || ''),
    personIds: Array.from(new Set((Array.isArray(r.personIds) ? r.personIds : []).map(String))),
    sources: normSources(r.sources), origin: r.origin === 'seed' ? 'seed' : 'user'
  };
}

/* Valida qualquer documento externo: referências, duplicidades, ciclos e tipos. */
function sanitizeDoc(raw) {
  if (!raw || typeof raw !== 'object' || !Array.isArray(raw.persons)) throw new Error('O arquivo não contém a lista de pessoas ("persons").');
  if (raw.schemaVersion && raw.schemaVersion > SCHEMA_VERSION) throw new Error(`Versão de esquema ${raw.schemaVersion} é mais nova que a suportada (${SCHEMA_VERSION}).`);
  const doc = emptyDoc(), issues = [];
  const s = raw.settings || {};
  doc.settings.methodologyName = String(s.methodologyName || '');
  doc.settings.creationYearBC = toInt(s.creationYearBC);
  doc.settings.calendar = (s.calendar === 'BCAD' && doc.settings.creationYearBC > 0 && doc.settings.methodologyName.trim()) ? 'BCAD' : 'AM';
  const ids = new Set();
  for (const r of raw.persons) {
    if (!r || typeof r !== 'object' || !String(r.name || '').trim()) { issues.push('Pessoa sem nome ignorada.'); continue; }
    const p = normalizePerson(r);
    if (ids.has(p.id)) { issues.push(`ID duplicado ignorado: ${p.id}.`); continue; }
    if (p.birth.year !== null && p.death.year !== null && p.death.year < p.birth.year) { issues.push(`${p.name}: falecimento anterior ao nascimento; ano de falecimento removido.`); p.death = normDate(null); }
    ids.add(p.id); doc.persons.push(p);
  }
  const up = new Map();
  const reaches = (from, target) => { // sobe a partir de "from" procurando "target"
    const st = [from], seen = new Set();
    while (st.length) { const c = st.pop(); if (c === target) return true; if (seen.has(c)) continue; seen.add(c); (up.get(c) || []).forEach(x => st.push(x)); }
    return false;
  };
  const bio = new Set();
  for (const r of (Array.isArray(raw.parentLinks) ? raw.parentLinks : [])) {
    if (!r || !ids.has(String(r.parentId)) || !ids.has(String(r.childId))) { issues.push('Vínculo parental com pessoa inexistente ignorado.'); continue; }
    const l = {
      id: String(r.id || uid('l')), parentId: String(r.parentId), childId: String(r.childId),
      role: VOC.linkRole[r.role] ? r.role : 'guardian', kind: VOC.linkKind[r.kind] ? r.kind : 'biological',
      evidence: VOC.evidence[r.evidence] ? r.evidence : 'informed', note: String(r.note || '')
    };
    if (reaches(l.parentId, l.childId)) { issues.push(`Vínculo que criaria ciclo ignorado (${l.parentId} → ${l.childId}).`); continue; }
    if (l.kind === 'biological' && l.role !== 'guardian') {
      const key = l.childId + '|' + l.role;
      if (bio.has(key)) { issues.push(`Segundo ${VOC.linkRole[l.role].toLowerCase()} biológico ignorado para ${l.childId}.`); continue; }
      bio.add(key);
    }
    if (!up.has(l.childId)) up.set(l.childId, []);
    up.get(l.childId).push(l.parentId);
    doc.parentLinks.push(l);
  }
  const pairSeen = new Set();
  for (const r of (Array.isArray(raw.unions) ? raw.unions : [])) {
    const ps = Array.isArray(r && r.partnerIds) ? r.partnerIds.map(String) : [];
    if (ps.length !== 2 || ps[0] === ps[1] || !ids.has(ps[0]) || !ids.has(ps[1])) { issues.push('União inválida ignorada.'); continue; }
    const key = ps.slice().sort().join('|');
    if (pairSeen.has(key)) continue;
    pairSeen.add(key);
    doc.unions.push({
      id: String(r.id || uid('u')), partnerIds: ps, kind: VOC.unionKind[r.kind] ? r.kind : 'marriage',
      evidence: VOC.evidence[r.evidence] ? r.evidence : 'informed',
      startYear: toInt(r.startYear), endYear: toInt(r.endYear), note: String(r.note || '')
    });
  }
  for (const r of (Array.isArray(raw.events) ? raw.events : [])) {
    if (!r || !String(r.name || '').trim()) { issues.push('Evento sem nome ignorado.'); continue; }
    const e = normalizeEvent(r);
    const before = e.personIds.length;
    e.personIds = e.personIds.filter(id => ids.has(id));
    if (e.personIds.length !== before) issues.push(`Evento "${e.name}": personagens inexistentes removidos.`);
    if (e.anchor && !ids.has(e.anchor.personId)) { e.anchor = null; issues.push(`Evento "${e.name}": vínculo de data removido.`); }
    if (e.start !== null && e.end !== null && e.end < e.start) { e.end = null; issues.push(`Evento "${e.name}": fim anterior ao início removido.`); }
    doc.events.push(e);
  }
  return { doc, issues };
}

const Store = {
  doc: emptyDoc(), saveError: false,
  load() {
    let raw = null;
    try { raw = localStorage.getItem(STORAGE_KEY); } catch (e) { toast('O navegador bloqueou o localStorage: os dados não serão preservados.', { error: true }); }
    if (raw) {
      try { this.doc = sanitizeDoc(JSON.parse(raw)).doc; }
      catch (e) {
        try { localStorage.setItem(STORAGE_KEY + '.corrompido', raw); } catch (_) { /* sem espaço */ }
        toast('Dados salvos ilegíveis; os dados iniciais foram carregados e o original foi preservado.', { error: true, ms: 8000 });
        this.doc = Seed.build();
      }
    } else this.doc = Seed.build();
    Index.rebuild(this.doc);
  },
  saveNow() {
    const el = $('#saveState');
    try {
      localStorage.setItem(STORAGE_KEY, JSON.stringify(this.doc));
      this.saveError = false;
      el.textContent = 'Salvo'; el.classList.remove('err');
    } catch (e) {
      this.saveError = true;
      el.textContent = 'Falha ao salvar'; el.classList.add('err');
      toast('Não foi possível salvar: armazenamento cheio ou bloqueado. Exporte um backup em JSON.', { error: true, ms: 8000 });
    }
  },
  save: null,
  snapshot() { return JSON.stringify(this.doc); },
  replace(doc) { this.doc = doc; App.changed(); },
  exportText() { return JSON.stringify(Object.assign({ exportedAt: new Date().toISOString(), application: 'GenBIO' }, this.doc), null, 2); }
};
Store.save = debounce(() => Store.saveNow(), 250);

function withUndo(label, fn) {
  const snap = Store.snapshot();
  fn();
  toast(label, { action: { label: 'Desfazer', run: () => { Store.replace(sanitizeDoc(JSON.parse(snap)).doc); } } });
}

/* =====================================================================
 * CRONOLOGIA: sistemas de datação (AM é o único sem metodologia externa)
 * Todos os dados são guardados em AM. Outros sistemas só afetam a exibição
 * e exigem metodologia escolhida explicitamente pelo usuário.
 * ===================================================================== */
const Chrono = {
  systems: {
    AM: { id: 'AM', label: 'AM — Anno Mundi', needsMethodology: false, format: y => `AM ${y}` },
    BCAD: {
      id: 'BCAD', label: 'a.C. / d.C. — por metodologia declarada', needsMethodology: true,
      format: (y, s) => {
        // AM 0 = ano E a.C. Numeração astronômica: E a.C. = 1 − E; não existe ano zero na escala civil.
        const astro = 1 - s.creationYearBC + y;
        return astro <= 0 ? `${1 - astro} a.C.` : `${astro} d.C.`;
      }
    }
  },
  active() { return this.systems[Store.doc.settings.calendar] || this.systems.AM; },
  format(y) { return y === null || y === undefined ? '—' : this.active().format(y, Store.doc.settings); },
  am(y) { return `AM ${y}`; },
  prefix(prec) { return prec === 'approximate' ? 'c. ' : prec === 'estimated' ? 'est. ' : ''; },
  dateText(d) { return d.year === null ? 'Desconhecido' : this.prefix(d.precision) + this.format(d.year); },
  rangeText(a, b) {
    if (a === null && b === null) return 'Sem data';
    if (b === null || a === b) return this.format(a);
    if (a === null) return this.format(b);
    if (this.active().id === 'AM') return `AM ${a}–${b}`;
    return `${this.format(a)} – ${this.format(b)}`;
  },
  /* Idade: calculada pelas datas; caso contrário, a declarada na fonte. */
  age(p) {
    const b = p.birth.year, d = p.death.year;
    const computed = (b !== null && d !== null) ? d - b : null;
    if (computed !== null) return { value: computed, source: 'computed', stated: p.statedAge };
    if (p.statedAge !== null) return { value: p.statedAge, source: 'stated', stated: p.statedAge };
    return { value: null, source: 'none', stated: null };
  },
  lifeText(p) {
    const b = p.birth, d = p.death;
    if (b.year !== null && d.year !== null) {
      if (this.active().id === 'AM') return `${this.prefix(b.precision)}AM ${b.year} – ${this.prefix(d.precision)}${d.year}`;
      return `${this.dateText(b)} – ${this.dateText(d)}`;
    }
    if (b.year !== null) return `${this.dateText(b)} – ?`;
    if (d.year !== null) return `? – ${this.dateText(d)}`;
    if (p.birthAfter !== null) return `Nasc. após ${this.format(p.birthAfter)}`;
    if (p.birthBefore !== null) return `Nasc. antes de ${this.format(p.birthBefore)}`;
    return 'Datas desconhecidas';
  }
};

/* =====================================================================
 * PESSOAS
 * ===================================================================== */
const People = {
  get: id => Index.persons.get(id),
  all: () => Store.doc.persons,
  add(data) {
    const p = normalizePerson(Object.assign({ seq: Store.doc.persons.length + 1 }, data));
    if (!p.name) throw new Error('O nome é obrigatório.');
    this.assertDates(p);
    if (Index.persons.has(p.id)) throw new Error('ID já utilizado.');
    Store.doc.persons.push(p);
    Index.rebuild(Store.doc);
    return p;
  },
  update(id, data) {
    const i = Store.doc.persons.findIndex(p => p.id === id);
    if (i < 0) throw new Error('Pessoa não encontrada.');
    const p = normalizePerson(Object.assign({}, Store.doc.persons[i], data, { id }));
    if (!p.name) throw new Error('O nome é obrigatório.');
    this.assertDates(p);
    Store.doc.persons[i] = p;
    Index.rebuild(Store.doc);
    return p;
  },
  assertDates(p) {
    if (p.birth.year !== null && p.death.year !== null && p.death.year < p.birth.year) throw new Error('O ano de falecimento não pode ser anterior ao de nascimento.');
    if (p.birthAfter !== null && p.birthBefore !== null && p.birthAfter > p.birthBefore) throw new Error('O limite "nasceu depois de" não pode ser maior que "nasceu antes de".');
  },
  relationshipCount(id) {
    return (Index.parentsOf.get(id) || []).length + (Index.childrenOf.get(id) || []).length + (Index.unionsOf.get(id) || []).length + (Index.eventsOf.get(id) || []).length
      + Store.doc.events.filter(e => e.anchor && e.anchor.personId === id && !e.personIds.includes(id)).length;
  },
  /* Remove a pessoa e tudo que a referencia; filhos e cônjuges permanecem cadastrados. */
  remove(id) {
    const d = Store.doc, person = Index.persons.get(id);
    d.persons = d.persons.filter(p => p.id !== id);
    d.parentLinks = d.parentLinks.filter(l => l.parentId !== id && l.childId !== id);
    d.unions = d.unions.filter(u => !u.partnerIds.includes(id));
    for (const e of d.events) {
      e.personIds = e.personIds.filter(x => x !== id);
      if (e.anchor && e.anchor.personId === id) { // preserva o ano do evento ao desfazer a âncora
        e.start = person ? person[e.anchor.field].year : null;
        e.anchor = null;
      }
    }
    Index.rebuild(d);
  },
  disambiguator(p) {
    if ((Index.nameCount.get(norm(p.name)) || 0) < 2) return '';
    const parents = (Index.parentsOf.get(p.id) || []).map(l => Index.persons.get(l.parentId)).filter(Boolean);
    if (parents.length) return (p.sex === 'F' ? 'filha de ' : p.sex === 'M' ? 'filho de ' : 'filho(a) de ') + parents[0].name;
    return p.id;
  },
  label(p) {
    const dis = this.disambiguator(p);
    return p.name + (dis ? ` (${dis})` : '');
  },
  search(q, limit = 30, exclude) {
    const n = norm(q), hits = [];
    for (const p of Store.doc.persons) {
      if (exclude && exclude.has(p.id)) continue;
      if (!n) { hits.push([2, p]); continue; }
      const nm = norm(p.name);
      if (nm.startsWith(n)) hits.push([0, p]);
      else if (nm.includes(n) || p.altNames.some(a => norm(a).includes(n))) hits.push([1, p]);
    }
    hits.sort((a, b) => a[0] - b[0] || a[1].name.localeCompare(b[1].name, 'pt-BR'));
    return hits.slice(0, limit).map(h => h[1]);
  },
  /* Inconsistências cronológicas são alertas, não bloqueios: a fonte pode divergir. */
  warnings(p) {
    const out = [], a = Chrono.age(p);
    if (a.source === 'computed' && a.stated !== null && Math.abs(a.value - a.stated) > 1) out.push(`A idade declarada (${a.stated}) difere da calculada pelas datas (${a.value}).`);
    if (p.birth.year !== null) {
      if (p.birthAfter !== null && p.birth.year < p.birthAfter) out.push('O ano de nascimento é anterior ao limite "nasceu depois de".');
      if (p.birthBefore !== null && p.birth.year > p.birthBefore) out.push('O ano de nascimento é posterior ao limite "nasceu antes de".');
    }
    for (const l of (Index.parentsOf.get(p.id) || [])) {
      const par = Index.persons.get(l.parentId);
      if (!par || p.birth.year === null) continue;
      if (par.birth.year !== null && p.birth.year <= par.birth.year) out.push(`Nascimento igual ou anterior ao de ${par.name}, indicado(a) como ${VOC.linkRole[l.role].toLowerCase()}.`);
      if (l.kind === 'biological' && par.death.year !== null && p.birth.year > par.death.year + 1) out.push(`Nascimento depois do falecimento de ${par.name}.`);
    }
    return out;
  }
};

/* =====================================================================
 * RELACIONAMENTOS: fatos armazenados (pais e uniões) e integridade
 * ===================================================================== */
const Relations = {
  parentLinks: id => Index.parentsOf.get(id) || [],
  childLinks: id => Index.childrenOf.get(id) || [],
  unions: id => Index.unionsOf.get(id) || [],
  partnerOf: (u, id) => u.partnerIds[0] === id ? u.partnerIds[1] : u.partnerIds[0],
  spouses(id) { return this.unions(id).map(u => this.partnerOf(u, id)); },
  parents(id) { return this.parentLinks(id).map(l => l.parentId); },
  children(id) { return this.childLinks(id).map(l => l.childId); },
  siblings(id) {
    const out = new Map();
    for (const pl of this.parentLinks(id)) for (const cl of this.childLinks(pl.parentId)) {
      if (cl.childId === id) continue;
      if (!out.has(cl.childId)) out.set(cl.childId, []);
      out.get(cl.childId).push({ parentId: pl.parentId, role: pl.role, kinds: [pl.kind, cl.kind] });
    }
    return out;
  },
  ancestorSet(id) {
    const seen = new Set(), st = [id];
    while (st.length) { for (const l of this.parentLinks(st.pop())) if (!seen.has(l.parentId)) { seen.add(l.parentId); st.push(l.parentId); } }
    return seen;
  },
  descendantSet(id) {
    const seen = new Set(), st = [id];
    while (st.length) { for (const l of this.childLinks(st.pop())) if (!seen.has(l.childId)) { seen.add(l.childId); st.push(l.childId); } }
    return seen;
  },
  wouldCycle(parentId, childId) { return parentId === childId || this.ancestorSet(parentId).has(childId); },
  /* Valida um vínculo parental; devolve a mensagem de erro ou null. */
  validateParent(childId, parentId, role, kind, ignoreId) {
    if (!Index.persons.has(parentId)) return 'Pessoa inexistente.';
    if (parentId === childId) return 'Uma pessoa não pode ser pai ou mãe de si mesma.';
    if (this.wouldCycle(parentId, childId)) return `${Index.persons.get(parentId).name} é descendente desta pessoa; o vínculo criaria um ciclo.`;
    if (this.parentLinks(childId).some(l => l.parentId === parentId && l.id !== ignoreId)) return `${Index.persons.get(parentId).name} já possui vínculo parental com esta pessoa.`;
    if (kind === 'biological' && role !== 'guardian' && this.parentLinks(childId).some(l => l.role === role && l.kind === 'biological' && l.id !== ignoreId)) {
      return `Esta pessoa já possui ${role === 'father' ? 'pai' : 'mãe'} biológico(a). Use a natureza "Adotiva" ou "Outra" para um segundo vínculo.`;
    }
    return null;
  },
  addParent(childId, parentId, opts = {}) {
    const par = Index.persons.get(parentId);
    const role = opts.role || (par && par.sex === 'F' ? 'mother' : par && par.sex === 'M' ? 'father' : 'guardian');
    const kind = opts.kind || 'biological';
    const err = this.validateParent(childId, parentId, role, kind);
    if (err) throw new Error(err);
    const link = { id: uid('l'), parentId, childId, role, kind, evidence: opts.evidence || 'informed', note: opts.note || '' };
    Store.doc.parentLinks.push(link);
    Index.rebuild(Store.doc);
    return link;
  },
  removeParent(linkId) {
    Store.doc.parentLinks = Store.doc.parentLinks.filter(l => l.id !== linkId);
    Index.rebuild(Store.doc);
  },
  addUnion(a, b, opts = {}) {
    if (a === b) throw new Error('Uma pessoa não pode ser cônjuge de si mesma.');
    if (!Index.persons.has(a) || !Index.persons.has(b)) throw new Error('Pessoa inexistente.');
    const dup = this.unions(a).find(u => u.partnerIds.includes(b));
    if (dup) return dup;
    const u = { id: uid('u'), partnerIds: [a, b], kind: opts.kind || 'marriage', evidence: opts.evidence || 'informed', startYear: toInt(opts.startYear), endYear: toInt(opts.endYear), note: opts.note || '' };
    Store.doc.unions.push(u);
    Index.rebuild(Store.doc);
    return u;
  },
  removeUnion(id) {
    Store.doc.unions = Store.doc.unions.filter(u => u.id !== id);
    Index.rebuild(Store.doc);
  },
  /* Substitui os vínculos de uma pessoa pelo conteúdo do formulário, validando antes de alterar. */
  replacePersonLinks(id, parentRows, spouseRows) {
    const d = Store.doc, seen = new Set(), bio = new Set();
    for (const r of parentRows) {
      if (r.parentId === id) throw new Error('Uma pessoa não pode ser pai ou mãe de si mesma.');
      if (!Index.persons.has(r.parentId)) throw new Error('Pessoa selecionada não existe.');
      if (this.wouldCycle(r.parentId, id)) throw new Error(`${Index.persons.get(r.parentId).name} é descendente desta pessoa; o vínculo criaria um ciclo.`);
      if (seen.has(r.parentId)) throw new Error(`${Index.persons.get(r.parentId).name} foi selecionado(a) mais de uma vez como pai/mãe.`);
      seen.add(r.parentId);
      if (r.kind === 'biological' && r.role !== 'guardian') {
        if (bio.has(r.role)) throw new Error(`Só é possível um(a) ${r.role === 'father' ? 'pai' : 'mãe'} biológico(a).`);
        bio.add(r.role);
      }
    }
    const spSeen = new Set();
    for (const r of spouseRows) {
      if (r.partnerId === id) throw new Error('Uma pessoa não pode ser cônjuge de si mesma.');
      if (spSeen.has(r.partnerId)) throw new Error('O mesmo cônjuge foi selecionado mais de uma vez.');
      spSeen.add(r.partnerId);
    }
    d.parentLinks = d.parentLinks.filter(l => l.childId !== id);
    for (const r of parentRows) d.parentLinks.push({ id: r.id || uid('l'), parentId: r.parentId, childId: id, role: r.role, kind: r.kind, evidence: r.evidence, note: r.note || '' });
    const keep = d.unions.filter(u => u.partnerIds.includes(id));
    d.unions = d.unions.filter(u => !u.partnerIds.includes(id));
    for (const r of spouseRows) {
      const old = keep.find(u => u.partnerIds.includes(r.partnerId));
      d.unions.push(Object.assign(old || { id: uid('u'), partnerIds: [id, r.partnerId], startYear: null, endYear: null, note: '' }, { kind: r.kind, evidence: r.evidence }));
    }
    Index.rebuild(d);
  }
};

/* =====================================================================
 * PARENTESCO: sempre derivado dos vínculos, nunca armazenado
 * ===================================================================== */
const NATURE_RANK = { biological: 0, adoptive: 1, other: 2 };
const Kinship = {
  /* Ancestrais com menor distância; em empate, prefere o caminho biológico. */
  ancestorMap(id) {
    const memo = Index.ancMemo.get(id);
    if (memo) return memo;
    const map = new Map([[id, { depth: 0, nature: 'biological' }]]);
    let frontier = [id];
    let depth = 0;
    while (frontier.length) {
      depth++;
      const next = new Set();
      for (const c of frontier) {
        const cn = map.get(c).nature;
        for (const l of Relations.parentLinks(c)) {
          const nature = NATURE_RANK[l.kind] > NATURE_RANK[cn] ? l.kind : cn;
          const cur = map.get(l.parentId);
          if (!cur) { map.set(l.parentId, { depth, nature }); next.add(l.parentId); }
          else if (cur.depth === depth && NATURE_RANK[nature] < NATURE_RANK[cur.nature]) cur.nature = nature;
        }
      }
      frontier = Array.from(next);
    }
    Index.ancMemo.set(id, map);
    return map;
  },
  gendered(sex, m, f) { return sex === 'M' ? m : sex === 'F' ? f : `${m}/${f}`; },
  /* up: gerações de A até o ancestral comum; down: de B até ele. O termo descreve B em relação a A. */
  termFor(up, down, sex) {
    const g = (m, f) => this.gendered(sex, m, f);
    if (down === 0) {
      const asc = [null, ['pai', 'mãe'], ['avô', 'avó'], ['bisavô', 'bisavó'], ['trisavô', 'trisavó'], ['tetravô', 'tetravó'], ['pentavô', 'pentavó'], ['hexavô', 'hexavó']];
      return asc[up] ? g(asc[up][0], asc[up][1]) : `ancestral direto (${up} gerações acima)`;
    }
    if (up === 0) {
      const desc = [null, ['filho', 'filha'], ['neto', 'neta'], ['bisneto', 'bisneta'], ['trineto', 'trineta'], ['tetraneto', 'tetraneta'], ['pentaneto', 'pentaneta'], ['hexaneto', 'hexaneta']];
      return desc[down] ? g(desc[down][0], desc[down][1]) : `descendente direto (${down} gerações abaixo)`;
    }
    if (up === 1 && down === 1) return g('irmão', 'irmã');
    if (down === 1) {
      const t = [null, null, ['tio', 'tia'], ['tio-avô', 'tia-avó'], ['tio-bisavô', 'tia-bisavó'], ['tio-trisavô', 'tia-trisavó']];
      return t[up] ? g(t[up][0], t[up][1]) : g('tio', 'tia') + ` de ascendente (${up} gerações acima)`;
    }
    if (up === 1) {
      const t = [null, null, ['sobrinho', 'sobrinha'], ['sobrinho-neto', 'sobrinha-neta'], ['sobrinho-bisneto', 'sobrinha-bisneta'], ['sobrinho-trineto', 'sobrinha-trineta']];
      return t[down] ? g(t[down][0], t[down][1]) : g('sobrinho', 'sobrinha') + ` de descendente (${down} gerações abaixo)`;
    }
    const degree = Math.min(up, down) - 1, removed = Math.abs(up - down);
    let s = `${g('primo', 'prima')} de ${degree}º grau`;
    if (removed) s += `, ${removed} ${removed === 1 ? 'geração' : 'gerações'} ${down > up ? 'abaixo' : 'acima'}`;
    return s;
  },
  natureSuffix(nature, direct, sex) {
    if (nature === 'biological') return '';
    if (nature === 'adoptive') return direct ? ` ${sex === 'F' ? 'adotiva' : sex === 'M' ? 'adotivo' : 'adotivo(a)'}` : ' (por adoção)';
    return ' (vínculo de outra natureza)';
  },
  blood(aId, bId) {
    if (aId === bId) return null;
    const A = this.ancestorMap(aId), B = this.ancestorMap(bId);
    let best = null;
    const small = A.size <= B.size ? A : B;
    for (const id of small.keys()) {
      const x = A.get(id), y = B.get(id);
      if (!x || !y) continue;
      const nature = NATURE_RANK[x.nature] >= NATURE_RANK[y.nature] ? x.nature : y.nature;
      const sum = x.depth + y.depth;
      if (!best || sum < best.sum || (sum === best.sum && NATURE_RANK[nature] < NATURE_RANK[best.nature])) best = { up: x.depth, down: y.depth, sum, nature, ancestorId: id };
    }
    return best;
  },
  siblingTerm(aId, bId, sex) {
    const pa = Relations.parentLinks(aId), pb = Relations.parentLinks(bId);
    const shared = pa.filter(l => pb.some(m => m.parentId === l.parentId));
    if (shared.length >= 2) return this.gendered(sex, 'irmão', 'irmã');
    if (shared.length === 1) {
      const side = shared[0].role === 'father' ? 'por parte de pai' : shared[0].role === 'mother' ? 'por parte de mãe' : 'por um genitor comum';
      const hasOtherA = pa.some(l => l.role !== shared[0].role && l.parentId !== shared[0].parentId && l.kind === 'biological');
      const hasOtherB = pb.some(l => l.role !== shared[0].role && l.parentId !== shared[0].parentId && l.kind === 'biological');
      return hasOtherA && hasOtherB ? `${this.gendered(sex, 'meio-irmão', 'meia-irmã')} (${side})` : `${this.gendered(sex, 'irmão', 'irmã')} ${side}`;
    }
    return this.gendered(sex, 'irmão', 'irmã');
  },
  /* Todas as relações de B em relação a A (consanguínea, conjugal e por afinidade). */
  between(aId, bId) {
    const b = Index.persons.get(bId), out = [];
    if (!b || !Index.persons.has(aId) || aId === bId) return out;
    const sex = b.sex;
    const g = (m, f) => this.gendered(sex, m, f);
    const bl = this.blood(aId, bId);
    const add = (term, group, extra = {}) => out.push(Object.assign({ term, group }, extra));
    const u = Relations.unions(aId).find(x => x.partnerIds.includes(bId));
    if (u) add(g('esposo', 'esposa') + (u.kind === 'marriage' ? '' : ` (${VOC.unionKind[u.kind].toLowerCase()})`), 'conjugal');
    if (bl) {
      const direct = bl.up === 0 || bl.down === 0;
      let term = (bl.up === 1 && bl.down === 1) ? this.siblingTerm(aId, bId, sex) : this.termFor(bl.up, bl.down, sex);
      term += this.natureSuffix(bl.nature, direct && bl.sum === 1, sex);
      const group = bl.nature === 'biological' ? 'consanguíneo' : VOC.linkKind[bl.nature].toLowerCase();
      add(term, group, { up: bl.up, down: bl.down, civilDegree: bl.sum, ancestorId: bl.ancestorId, nature: bl.nature });
    }
    const aSp = Relations.spouses(aId), bSp = Relations.spouses(bId);
    const aPar = Relations.parents(aId), bPar = Relations.parents(bId), aChi = Relations.children(aId), aSib = Relations.siblings(aId), bSib = Relations.siblings(bId);
    if (aSp.some(s => Relations.parents(s).includes(bId)) && !aPar.includes(bId)) add(g('sogro', 'sogra'), 'afinidade');
    if (bSp.some(s => aChi.includes(s)) && !aChi.includes(bId)) add(g('genro', 'nora'), 'afinidade');
    if (!u && (aSp.some(s => bSib.has(s)) || bSp.some(s => aSib.has(s))) && !aSib.has(bId)) add(g('cunhado', 'cunhada'), 'afinidade');
    if (aPar.some(pid => bSp.includes(pid)) && !aPar.includes(bId)) add(g('padrasto', 'madrasta'), 'afinidade');
    if (aSp.some(s => bPar.includes(s)) && !aChi.includes(bId)) add(g('enteado', 'enteada'), 'afinidade');
    return out;
  },
  /* Lista de parentes mais próximos; o cálculo é feito só quando o usuário abre a seção. */
  relativesOf(id, limit = 80) {
    const out = [];
    for (const p of Store.doc.persons) {
      if (p.id === id) continue;
      const rel = this.between(id, p.id);
      if (!rel.length) continue;
      const score = rel[0].civilDegree !== undefined ? rel[0].civilDegree : (rel[0].group === 'conjugal' ? 0 : 2);
      out.push({ id: p.id, rel, score });
    }
    out.sort((a, b) => a.score - b.score);
    return { total: out.length, list: out.slice(0, limit) };
  }
};

/* =====================================================================
 * EVENTOS: módulo independente
 * ===================================================================== */
const Events = {
  all: () => Store.doc.events,
  get: id => Index.events.get(id),
  years(e) {
    if (e.anchor) {
      const p = Index.persons.get(e.anchor.personId);
      const y = p ? p[e.anchor.field].year : null;
      return { start: y, end: y };
    }
    return { start: e.start, end: e.end !== null ? e.end : e.start };
  },
  validate(e) {
    if (!e.name) throw new Error('O nome do evento é obrigatório.');
    if (e.start !== null && e.end !== null && e.end < e.start) throw new Error('O ano final não pode ser anterior ao inicial.');
    if (e.end !== null && e.start === null) throw new Error('Informe o ano inicial do intervalo.');
  },
  add(data) {
    const e = normalizeEvent(data);
    this.validate(e);
    Store.doc.events.push(e);
    Index.rebuild(Store.doc);
    return e;
  },
  update(id, data) {
    const i = Store.doc.events.findIndex(e => e.id === id);
    if (i < 0) throw new Error('Evento não encontrado.');
    const e = normalizeEvent(Object.assign({}, data, { id }));
    this.validate(e);
    Store.doc.events[i] = e;
    Index.rebuild(Store.doc);
    return e;
  },
  remove(id) {
    Store.doc.events = Store.doc.events.filter(e => e.id !== id);
    Index.rebuild(Store.doc);
  },
  sorted() {
    return this.all().slice().sort((a, b) => {
      const ya = this.years(a).start, yb = this.years(b).start;
      if (ya === null && yb === null) return a.name.localeCompare(b.name, 'pt-BR');
      if (ya === null) return 1;
      if (yb === null) return -1;
      return ya - yb;
    });
  },
  ofPerson(id) {
    const list = (Index.eventsOf.get(id) || []).slice();
    return list.sort((a, b) => (this.years(a).start ?? 1e9) - (this.years(b).start ?? 1e9));
  },
  search(q, limit = 8) {
    const n = norm(q);
    if (!n) return [];
    return this.all().filter(e => norm(e.name).includes(n)).slice(0, limit);
  },
  rangeText(e) {
    const y = this.years(e);
    if (y.start === null) return 'Sem data';
    return Chrono.prefix(e.precision) + Chrono.rangeText(y.start, y.end);
  }
};
